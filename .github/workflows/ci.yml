name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_JOB: lint
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Prepare RuboCop cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run lint
        run: bin/ci

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_JOB: security

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Run security
        run: bin/ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_JOB: test
      RAILS_ENV: test
      SECRET_KEY_BASE: ci_dummy_secret_key_base_for_tests
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_control_ruby_api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_control_ruby_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Run tests
        run: bin/ci

  ci:
    if: always()
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: All jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint=$LINT security=$SECURITY test=$TEST"
          [ "$LINT" = success ] && [ "$SECURITY" = success ] && [ "$TEST" = success ]

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.ENABLE_LIGHTSAIL_DEPLOY == 'true'
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.LIGHTSAIL_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.LIGHTSAIL_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Allow this runner through Lightsail SSH
        env:
          LIGHTSAIL_INSTANCE_NAME: financial-control-api
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          if ! printf '%s\n' "${runner_ip}" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            echo "Could not determine a valid IPv4 address for this runner."
            exit 1
          fi
          echo "RUNNER_CIDR=${runner_ip}/32" >> "${GITHUB_ENV}"
          aws lightsail open-instance-public-ports \
            --region us-east-1 \
            --instance-name "${LIGHTSAIL_INSTANCE_NAME}" \
            --port-info "{\"fromPort\":22,\"toPort\":22,\"protocol\":\"tcp\",\"cidrs\":[\"${runner_ip}/32\"]}"
          sleep 3

      - name: Sync compose files and restart app containers
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          SSH_USER: ubuntu
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/deploy"
          printf '%s\n' "${SSH_KEY}" > "${HOME}/.ssh/deploy"
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "LIGHTSAIL_SSH_KNOWN_HOSTS is empty. Refusing to trust the host key from the network."
            exit 1
          fi
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          SSH_OPTS="-i ${HOME}/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
          rsync -az -e "ssh ${SSH_OPTS}" \
            docker-compose.production.yml \
            "${SSH_USER}@${SSH_HOST}:/opt/financial-control/"
          rsync -az --delete -e "ssh ${SSH_OPTS}" \
            deploy/ \
            "${SSH_USER}@${SSH_HOST}:/opt/financial-control/deploy/"
          printf '%s' "${GHCR_TOKEN}" | ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io -u ${GHCR_USER} --password-stdin"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" \
            "bash /opt/financial-control/deploy/scripts/install-host-cron.sh"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" \
            "cd /opt/financial-control && IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.production.yml pull api jobs && IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.production.yml up -d --no-deps api jobs nginx"

      - name: Revoke this runner from Lightsail SSH
        if: always() && env.RUNNER_CIDR != ''
        env:
          LIGHTSAIL_INSTANCE_NAME: financial-control-api
        run: |
          aws lightsail close-instance-public-ports \
            --region us-east-1 \
            --instance-name "${LIGHTSAIL_INSTANCE_NAME}" \
            --port-info "{\"fromPort\":22,\"toPort\":22,\"protocol\":\"tcp\",\"cidrs\":[\"${RUNNER_CIDR}\"]}"
