name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_JOB: lint
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run lint
        run: bin/ci

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_JOB: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Run security
        run: bin/ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_JOB: test
      RAILS_ENV: test
      SECRET_KEY_BASE: ci_dummy_secret_key_base_for_tests
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_control_ruby_api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_control_ruby_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Run tests
        run: bin/ci

  ci:
    if: always()
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: All jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint=$LINT security=$SECURITY test=$TEST"
          [ "$LINT" = success ] && [ "$SECURITY" = success ] && [ "$TEST" = success ]
