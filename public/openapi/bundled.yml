openapi: 3.1.0
info:
  title: Financial Control Ruby API
  version: 1.0.23
  description: |
    ## Authentication

    Protected endpoints require a **Bearer session token** in the `Authorization` header:

    ```http
    Authorization: Bearer <token>
    ```

    ### Flow

    1. **Register** — `POST /api/v1/user/registrations`
    2. **Confirm email** — `POST /api/v1/user/email/confirmations` (token from email)
    3. **Sign in** — `POST /api/v1/user/authentications` → `token` in the JSON body; `refresh_token` is set as an encrypted httpOnly cookie (`SameSite=Lax`; `Secure` in production). Optional `remember_me` controls cookie and refresh lifetime. Sign in **revokes every previous refresh session**. An older Bearer token remains valid until it expires (15 minutes)
    4. **Call protected endpoints** with `Authorization: Bearer <token>`. A valid token for an **inactive** user is also **401**
    5. **Refresh** — when the session token expires, `PATCH /api/v1/user/session/refreshes` (reads the `refresh_token` cookie; optional `remember_me` in the body)
    6. **Revoke** — `DELETE /api/v1/user/session/revokes` to invalidate all active sessions (Bearer required). Does not clear the `refresh_token` cookie. Password change, password reset, and email change also revoke refresh sessions without deleting the cookie

    ### Token lifetimes

    | Token | Lifetime |
    |-------|----------|
    | Session (`token`) | 15 minutes |
    | Refresh cookie (`remember_me: true`) | 30 days |
    | Refresh cookie (without `remember_me`) | session cookie / 1 day server-side |
    | Email confirmation | 24 hours |
    | Password reset | 15 minutes |

    ### Public vs protected

    | Access | Endpoints |
    |--------|-----------|
    | Public | registrations, authentications, email confirmations, password resets, session refreshes |
    | Bearer required | tags, categories, institutions, accounts, credit cards, monthly statements, monthly statuses, settlements, transactions, notifications, profiles, account deletion, email changes, password changes, session revokes |
    | Session token (query or `Authorization`) | Action Cable at `/cable` (`MonthlyStatusChannel`, `NotificationChannel`) |

    ---

    ## WebSockets

    Action Cable is mounted at `/cable`. Use the same session token as the REST API:

    ```
    ws://localhost:3000/cable?token=<token>
    ```

    Native clients may send `Authorization: Bearer <token>` on the WebSocket handshake instead of the query param.

    The handshake is rejected when the token is missing or invalid, or when the user is inactive.

    Subscribe to a calendar month owned by the current user:

    ```json
    { "channel": "MonthlyStatusChannel", "month": 8, "year": 2026 }
    ```

    The monthly status row must already exist (same identity as `GET /api/v1/monthly_statuses`). Otherwise the subscription is rejected.

    On subscribe, and whenever the `processing` column changes, the server sends:

    ```json
    { "processing": true, "last_processed_at": null }
    ```

    `last_processed_at` is an ISO 8601 timestamp, or `null` when the month has never finished a processing run.

    Subscribe to the current user's notification stream (no params):

    ```json
    { "channel": "NotificationChannel" }
    ```

    There is no initial payload on subscribe. The client loads unread count and the first page via `GET /api/v1/notifications`.

    When a single notification is created, the server sends the notification kind, the JSON:API resource, and the current unread count:

    ```json
    {
      "kind": "transaction.validation.errors",
      "notification": {
        "id": "0199...",
        "type": "notification",
        "attributes": { "id": "0199...", "kind": "transaction.validation.errors", "title": "...", "read": false }
      },
      "unread_count": 7
    }
    ```

    When a job creates several notifications for the same user, the server sends a group event without the resource. Batch kinds today are `settlement.errors` and `monthly_status.errors`:

    ```json
    { "kind": "settlement.errors", "unread_count": 7 }
    ```

    Distinguish the two by the presence of `notification`. If it is present, the item can be inserted at the top of the list. If it is absent, update the badge from `unread_count` and refetch `GET /api/v1/notifications`.

    ---

    ## Locale

    When the request is authenticated, API messages follow this order:

    1. `configs.locale` from the current user (`en` or `pt-BR`)
    2. Default: English (`en`)

    Cookie and `Accept-Language` are ignored while the user is authenticated.

    When the request is not authenticated, API messages follow this order:

    1. `locale` cookie (`en` or `pt-BR`)
    2. `Accept-Language` header (`pt-BR`, `pt`, `en`, …)
    3. Default: English (`en`)

    The API reads the `locale` cookie; it does not set it. The client must set the cookie when it
    wants unauthenticated messages in a given locale.

    On sign in (`POST /api/v1/user/authentications`), if a valid `locale` cookie is present
    and differs from the user's `configs.locale`, the stored locale is updated to match the cookie.

    ---

    ## Response envelope

    Success:

    ```json
    { "status": "success", "type": "object", "data": {}, "message": "optional" }
    ```

    Error:

    ```json
    { "status": "error", "message": "...", "details": { "field": ["..."] } }
    ```

    Unexpected failures on `/api/v1` return **500** with that JSON envelope. In production the message is a generic internal-server-error string; outside production it is the exception message.

    Rate-limit responses (**429**) are **not** JSON. They are Rack::Attack's default `text/plain` body (`Retry later`).

    ---

    ## Rate limiting

    All HTTP endpoints except `/up` and `/cable` (any method) are throttled:

    | Scope | Limit |
    |-------|-------|
    | General | 300 requests / 5 minutes per IP, hashed Bearer token, and user id |
    | Auth endpoints | 10 requests / 1 minute |

    Dedicated auth throttles apply to:

    - `POST /api/v1/user/authentications` (per IP and email)
    - `POST /api/v1/user/registrations` (per IP and email)
    - `POST /api/v1/user/password/resets` (per IP and email)
    - `PATCH /api/v1/user/password/resets` (per IP and token)
    - `PATCH /api/v1/user/session/refreshes` (per IP and refresh cookie)

    Every operation documents **429**. Email confirmation, password change, email change, and session revoke use only the general throttle.

    ---

    ## Time zone

    The API uses `America/Sao_Paulo`. Calendar months, settlement `reference_date`, and production recurring jobs follow that zone.

    Production jobs (`config/recurring.yml`):

    - Settle open months daily at 03:00
    - Close previous open months at 05:00 on the 1st
    - Clear finished Solid Queue jobs hourly at minute 12

    ---

    ## Other HTTP surfaces

    These are not OpenAPI operations:

    | Path | Purpose |
    |------|---------|
    | `GET /up` | Rails health check |
    | `GET /docs` | Redirects to the Redoc UI |
    | `/openapi/*` | Static OpenAPI files (Redoc loads `/openapi/bundled.yml`) |
    | `/jobs` | Mission Control Jobs (HTTP basic auth) |
    | `/cable` | Action Cable (see WebSockets) |
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Authentication
    description: Sign in, refresh session, and revoke sessions
  - name: User
    description: Registration, profile, account, email, and password
  - name: Tags
    description: User-owned labels for categorizing transactions
  - name: Categories
    description: User-owned categories for organizing transactions
  - name: Institutions
    description: User-owned financial institutions
  - name: Accounts
    description: User-owned financial accounts (bank accounts and cash)
  - name: Credit Cards
    description: User-owned credit cards
  - name: Transactions
    description: User-owned financial transactions (income, expense, and transfers)
  - name: Monthly Statements
    description: Monthly statement items for accounts, credit cards, and transfers between accounts
  - name: Monthly Statuses
    description: Open or closed status of a calendar month for the authenticated user, including processing updates over Action Cable
  - name: Settlements
    description: Enqueue processing of due transaction occurrences, transfers, and credit-card invoices
  - name: Notifications
    description: User notifications with cursor pagination, unread count, and real-time delivery over Action Cable
paths:
  /api/v1/tags:
    get:
      tags:
        - Tags
      summary: List tags
      description: Returns a paginated list of tags for the authenticated user. Supports Ransack filters via `q`.
      operationId: listTags
      security:
        - bearerAuth: []
      parameters:
        - name: q[name_cont]
          in: query
          required: false
          schema:
            type: string
          description: Filter tags whose name contains the given value
        - name: q[active_eq]
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active flag
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: name asc
          description: Sort expression (default `active desc, name asc`)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Tags listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Tags
      summary: Create tag
      description: Creates a new tag for the authenticated user.
      operationId: createTag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
            example:
              tag:
                name: Vacation
                color: '#3B82F6'
                active: true
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tags/{id}:
    get:
      tags:
        - Tags
      summary: Show tag
      description: Returns a single tag owned by the authenticated user.
      operationId: showTag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tag found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Tags
      summary: Update tag
      description: Updates an existing tag owned by the authenticated user.
      operationId: updateTag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
            example:
              tag:
                name: Vacation
                color: '#10B981'
                active: false
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Tags
      summary: Delete tag
      description: Deletes a tag owned by the authenticated user.
      operationId: deleteTag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tag deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: List categories
      description: Returns a paginated list of categories for the authenticated user. Supports Ransack filters via `q`.
      operationId: listCategories
      security:
        - bearerAuth: []
      parameters:
        - name: q[name_cont]
          in: query
          required: false
          schema:
            type: string
          description: Filter categories whose name contains the given value
        - name: q[active_eq]
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active flag
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: name asc
          description: Sort expression (default `active desc, name asc`)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Categories listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Categories
      summary: Create category
      description: Creates a new category for the authenticated user.
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              category:
                name: Vacation
                color: '#3B82F6'
                active: true
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/categories/{id}:
    get:
      tags:
        - Categories
      summary: Show category
      description: Returns a single category owned by the authenticated user.
      operationId: showCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Categories
      summary: Update category
      description: Updates an existing category owned by the authenticated user.
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
            example:
              category:
                name: Vacation
                color: '#10B981'
                active: false
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Categories
      summary: Delete category
      description: |
        Deletes a category owned by the authenticated user.
        Categories already used by transactions cannot be deleted; inactivate them instead.
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/institutions:
    get:
      tags:
        - Institutions
      summary: List institutions
      description: Returns a paginated list of institutions for the authenticated user. Supports Ransack filters via `q`.
      operationId: listInstitutions
      security:
        - bearerAuth: []
      parameters:
        - name: q[name_cont]
          in: query
          required: false
          schema:
            type: string
          description: Filter institutions whose name contains the given value
        - name: q[active_eq]
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active flag
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: name asc
          description: Sort expression (default `active desc, name asc`)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Institutions listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Institutions
      summary: Create institution
      description: Creates a new institution for the authenticated user. `name` and `logo_key` are required.
      operationId: createInstitution
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionRequest'
            example:
              institution:
                name: Nubank
                logo_key: institutions/nubank.png
                active: true
      responses:
        '201':
          description: Institution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/institutions/{id}:
    get:
      tags:
        - Institutions
      summary: Show institution
      description: Returns a single institution owned by the authenticated user.
      operationId: showInstitution
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Institution found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Institutions
      summary: Update institution
      description: Updates an existing institution owned by the authenticated user.
      operationId: updateInstitution
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionUpdateRequest'
            example:
              institution:
                name: Nubank
                logo_key: institutions/nubank-v2.png
                active: false
      responses:
        '200':
          description: Institution updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Institutions
      summary: Delete institution
      description: |
        Deletes an institution owned by the authenticated user.
        Institutions with accounts or credit cards already used by transactions cannot be deleted; inactivate them instead.
        Linked accounts and credit cards that are not used by transactions are also deleted.
      operationId: deleteInstitution
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Institution deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accounts:
    get:
      tags:
        - Accounts
      summary: List accounts
      description: Returns a paginated list of accounts for the authenticated user. Supports Ransack filters via `q`.
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: q[name_cont]
          in: query
          required: false
          schema:
            type: string
          description: Filter accounts whose name contains the given value
        - name: q[kind_eq]
          in: query
          required: false
          schema:
            type: string
            enum:
              - bank_account
              - cash
          description: Filter by account kind
        - name: q[bank_account_type_eq]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BankAccountType'
          description: Filter by bank account type (relevant for `bank_account` kind)
        - name: q[institution_id_eq]
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by institution id (relevant for `bank_account` kind)
        - name: q[current_balance_eq]
          in: query
          required: false
          schema:
            type: number
          description: Filter by exact current balance
        - name: q[allow_negative_balance_eq]
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by whether negative balance is allowed
        - name: q[active_eq]
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active flag
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: name asc
          description: Sort expression (default `active desc, name asc`)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Accounts listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Accounts
      summary: Create account
      description: |
        Creates a new account for the authenticated user.

        Permitted fields depend on `kind`:
        - `bank_account` — requires `institution_id` (must belong to the user and be active) and `bank_account_type`
        - `cash` — must omit `institution_id` and `bank_account_type`
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            examples:
              bank_account:
                summary: Bank account
                value:
                  account:
                    name: Nubank Checking
                    kind: bank_account
                    institution_id: 0198f0c2-7b3a-7b6e-9f2d-1a2b3c4d5e6f
                    bank_account_type: checking
                    color: '#820AD1'
                    allow_negative_balance: false
                    active: true
