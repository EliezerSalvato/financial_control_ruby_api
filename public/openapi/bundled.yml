            current_balance:
              type: number
            color:
              type: string
              pattern: ^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$
              description: Hex color (`#RRGGBB` or `#RRGGBBAA`)
              example: '#3B82F6'
            allow_negative_balance:
              type: boolean
            active:
              type: boolean
          description: Partial update — only provided fields are changed
    CreditCardAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        institution_id:
          type: string
          format: uuid
        default_payment_account_id:
          type: string
          format: uuid
        name:
          type: string
        total_limit:
          type: string
          description: Decimal amount as string (precision 15, scale 2)
          example: '5000.0'
        available_limit:
          type: string
          description: |
            Decimal amount as string (precision 15, scale 2).
            Settlement keeps it between 0 and `total_limit` unless `allow_negative_available_limit` is true,
            in which case it may go below 0. Updating `total_limit` still rejects a resulting negative
            `available_limit`, even when that flag is true.
          example: '5000.0'
        closing_day:
          type: integer
          minimum: 1
          maximum: 31
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        network:
          type: string
          example: mastercard
        allow_negative_available_limit:
          type: boolean
          description: When true, settlement may leave `available_limit` negative
        active:
          type: boolean
    CreditCardResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: credit_card
        attributes:
          $ref: '#/components/schemas/CreditCardAttributes'
    CreditCardCollection:
      type: object
      required:
        - status
        - type
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/CreditCardResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
