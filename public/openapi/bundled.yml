        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyStatementResource'
    MonthlyStatementTransferAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Transaction id
        kind:
          type: string
          const: transfer_between_accounts
        description:
          type: string
        recurrence_type:
          type: string
          enum:
            - one_time
            - installment
            - recurring
        source_account_id:
          type: string
          format: uuid
        source_account_name:
          type: string
        source_account_brand:
          type: string
          description: |
            Institution `logo_key` for bank accounts (falls back to the account color when the
            institution has no logo). Cash accounts use the account color.
        destination_account_id:
          type: string
          format: uuid
        destination_account_name:
          type: string
        destination_account_brand:
          type: string
          description: |
            Institution `logo_key` for bank accounts (falls back to the account color when the
            institution has no logo). Cash accounts use the account color.
        opening_date:
          type: string
          format: date
          description: First day of the calendar month
        closing_date:
          type: string
          format: date
          description: Last day of the calendar month
        value:
          type: string
          description: Decimal amount as string (precision 15, scale 2) from the current recurrence
          example: '100.0'
        first_recurrence_on:
          type: string
          format: date
          description: Earliest `starts_on` across all recurrences of the transfer
        current_recurrence_on:
          type: string
          format: date
          description: |
            First recurrence day projected onto the period opening month. If that date is before
            `opening_date`, it advances one month. If that date is after `closing_date` and the previous
            month is shorter than the period closing day, it moves to the day after that previous
            month's last day. The day is clamped to the last day of the month when needed. Never
            precedes `first_recurrence_on`. Recurring items are omitted when this date is outside the
            period.
        starts_on:
          type: string
          format: date
          description: '`starts_on` of the current recurrence'
        ends_on:
          type:
            - string
            - 'null'
          format: date
        canceled_on:
          type:
            - string
            - 'null'
          format: date
          description: Set when the transfer is canceled. Null otherwise.
    MonthlyStatementTransferResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: monthly_statement_transfer
        attributes:
          $ref: '#/components/schemas/MonthlyStatementTransferAttributes'
    MonthlyStatementTransferCollection:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyStatementTransferResource'
    MonthlyStatusAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
          minimum: 1
          maximum: 9999
        status:
          type: string
          enum:
            - open
            - closed
        processing:
          type: boolean
        last_processed_at:
          type: string
          format: date-time
          nullable: true
    MonthlyStatusResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: monthly_status
        attributes:
          $ref: '#/components/schemas/MonthlyStatusAttributes'
    MonthlyStatusSuccessResponse:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        message:
          type: string
        data:
          $ref: '#/components/schemas/MonthlyStatusResource'
    MonthlyStatusUpdateRequest:
      type: object
      required:
        - monthly_status
      properties:
        monthly_status:
          type: object
          required:
            - month
            - year
            - status
          properties:
            month:
              type: integer
              minimum: 1
              maximum: 12
            year:
              type: integer
              minimum: 1
              maximum: 9999
            status:
              type: string
              enum:
                - open
                - closed
              description: Closes or reopens the month
    SettlementProcessingRequest:
      type: object
      required:
        - settlement
      properties:
        settlement:
          type: object
          description: |
            The job expects `month`, `year`, and `reference_date`. HTTP does not require or validate
            these fields; missing or invalid values fail asynchronously and become notifications.
          properties:
            month:
              type: integer
              minimum: 1
              maximum: 12
            year:
              type: integer
              minimum: 1
              maximum: 9999
            reference_date:
              type: string
              format: date
              description: |
                Inclusive cutoff date. The job requires today or yesterday for the current month.
                Ignored for past months (the last day of the given month is used instead).
                Future months are rejected by the job, not by HTTP.
    NotificationAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: |
            Notification type generated by the system. Known values:

            - `transaction.validation.errors` — a transaction or transfer failed during settlement
            - `credit_card_invoice.validation.errors` — a credit card invoice failed during settlement
            - `settlement.errors` — settlement process failed as a whole, or an unexpected error occurred
            - `monthly_status.closing.errors` — a month could not be closed (pending items or closing failure)
            - `monthly_status.errors` — unexpected error in monthly closing
        title:
          type: string
        body:
          type:
            - string
            - 'null'
        read:
          type: boolean
        read_at:
          type:
            - string
            - 'null'
          format: date-time
        notifiable_type:
          type:
            - string
            - 'null'
          description: Weak reference type of the related resource, when any
        notifiable_id:
          type:
            - string
            - 'null'
          format: uuid
        data:
          type: object
          additionalProperties: true
          description: |
            Kind-specific payload. Shape varies by `kind`:

            - `transaction.validation.errors`: `type`, `item_kind`, `month`, `year`, `occurred_on`
            - `credit_card_invoice.validation.errors`: `type`, `month`, `year`, `due_date`
            - `settlement.errors`: `type`, `month`, `year`, and optional `error` (exception class name)
            - `monthly_status.closing.errors`: `month`, `year`, `pending_occurrences`, `pending_invoices`, `failure`
            - `monthly_status.errors`: `type`, optional `error`, and optional `month`/`year` when the competence is known
        created_at:
          type: string
          format: date-time
    NotificationResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: notification
        attributes:
          $ref: '#/components/schemas/NotificationAttributes'
    NotificationCursorMeta:
      type: object
      properties:
        limit:
          type: integer
        next_cursor:
          type:
            - string
            - 'null'
          description: Opaque cursor to fetch the next page; null when there are no more notifications
        has_more:
          type: boolean
        unread_count:
          type: integer
          description: Total unread notifications for the authenticated user
    NotificationCollection:
      type: object
      required:
        - status
        - type
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResource'
        meta:
          $ref: '#/components/schemas/NotificationCursorMeta'
    NotificationSuccessResponse:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        message:
          type: string
        data:
          $ref: '#/components/schemas/NotificationResource'
    NotificationReadAllResponse:
      type: object
      required:
        - status
        - message
        - meta
      properties:
        status:
          type: string
          const: success
        message:
          type: string
        meta:
          type: object
          properties:
            count:
              type: integer
              description: Number of notifications marked as read in this request
    TransactionRecurrenceAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        starts_on:
          type: string
          format: date
        value:
          type: string
          description: Decimal amount as string (precision 15, scale 2)
          example: '100.0'
    TransactionRecurrenceResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: transaction_recurrence
        attributes:
          $ref: '#/components/schemas/TransactionRecurrenceAttributes'
    TransactionAttributes:
      type: object
      description: |
        Common attributes, recurrences, and `current_value` are present on list and show.
        `account_id`, `credit_card_id`, `limit_consumption_type`, `source_account_id`, `destination_account_id`, and `tag_ids` are populated on show, create, update, and cancel.
        On list, `tag_ids` is always `null`. Payment targets that apply to the item
        (`account_id` for account-based methods, `credit_card_id` and `limit_consumption_type` for credit card,
        `source_account_id` and `destination_account_id` for transfers) are present as `null`.
        Fields that do not apply to the item are omitted, not sent as `null`.
        `account_id` is only included for account-based payment methods.
        `credit_card_id` and `limit_consumption_type` are only included when `payment_method` is `credit_card`.
        `source_account_id` and `destination_account_id` are only included when `kind` is `transfer_between_accounts`.
        `starts_on` is not a top-level attribute; it is returned on each item in `recurrences`.
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        kind:
          type: string
          enum:
            - income
            - expense
            - transfer_between_accounts
        status:
          type: string
          enum:
            - pending
            - active
            - completed
            - canceled
          description: Always `pending` on create. Not writable via update.
        payment_method:
          type: string
          nullable: true
          enum:
            - pix
            - debit
            - credit_card
            - ted
            - doc
            - deposit
            - cash
            - boleto
        recurrence_type:
          type: string
          enum:
            - one_time
            - installment
            - recurring
        installments_count:
          type: integer
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        canceled_on:
          type: string
          format: date
          nullable: true
          description: Set to the current date when the transaction is canceled. Null otherwise. Not writable.
        account_id:
          type: string
          format: uuid
          nullable: true
          description: Present only for account-based payment methods. `null` on list; omitted otherwise.
        credit_card_id:
          type: string
          format: uuid
          nullable: true
          description: Present only when `payment_method` is `credit_card`. `null` on list; omitted otherwise.
        limit_consumption_type:
          type: string
          nullable: true
          enum:
            - upfront
            - monthly
          description: |
            Present only when `payment_method` is `credit_card`. `null` on list; omitted otherwise.
            Always `upfront` for `one_time` and `monthly` for `recurring`.
            `installment` may be `upfront` or `monthly`.
        source_account_id:
          type: string
          format: uuid
          nullable: true
          description: Present only when `kind` is `transfer_between_accounts`. `null` on list; omitted otherwise.
        destination_account_id:
          type: string
          format: uuid
          nullable: true
          description: Present only when `kind` is `transfer_between_accounts`. `null` on list; omitted otherwise.
        tag_ids:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: Always `null` on list. Populated on show, create, update, and cancel.
        current_value:
          type: string
          nullable: true
          description: |
            Applicable amount for the current month: the latest recurrence whose year-month is on or before the current month.
            If every recurrence starts in a future month, the earliest recurrence value is used.
          example: '100.0'
        recurrences:
          type: array
          description: Value history ordered by `starts_on`
          items:
            $ref: '#/components/schemas/TransactionRecurrenceResource'
    TransactionResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: transaction
        attributes:
          $ref: '#/components/schemas/TransactionAttributes'
    TransactionCollection:
      type: object
      required:
        - status
        - type
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    TransactionRequest:
      type: object
      required:
        - transaction
      properties:
        transaction:
          type: object
          description: |
            Category, tags, account, and credit card must belong to the authenticated user and be active.
            `starts_on` is write-only; the response returns it on each item in `recurrences`.
          required:
            - category_id
            - description
            - kind
            - recurrence_type
            - starts_on
            - value
          properties:
            category_id:
              type: string
              format: uuid
              description: Must belong to the authenticated user and be active
            description:
              type: string
            kind:
              type: string
              enum:
                - income
                - expense
                - transfer_between_accounts
            payment_method:
              type: string
              nullable: true
              enum:
                - pix
                - debit
                - credit_card
                - ted
                - doc
                - deposit
                - cash
                - boleto
              description: |
                Required for income/expense. Must be null for transfer_between_accounts.
                Income allows pix|ted|doc|deposit|cash|boleto.
                Expense allows pix|debit|credit_card|ted|doc|deposit|cash|boleto.
            recurrence_type:
              type: string
              enum:
                - one_time
                - installment
                - recurring
            starts_on:
              type: string
              format: date
              description: First recurrence date. Write-only; the response exposes it on `recurrences`.
            ends_on:
              type: string
              format: date
              nullable: true
              description: |
                Required for installment. Optional for recurring. Must be null for one_time.
                Must be on or after `starts_on`.
                For installment, must fall in a later month than `starts_on` so `installments_count` is greater than 1.
            value:
              type: number
              minimum: 0
            limit_consumption_type:
              type: string
              nullable: true
              enum:
                - upfront
                - monthly
              description: |
                Used when payment_method is credit_card.
                Ignored for one_time (always upfront) and recurring (always monthly).
                Required for installment, which may choose upfront or monthly.
            account_id:
              type: string
              format: uuid
              description: |
                Required when payment_method is account-based (pix, debit, ted, doc, deposit, cash, boleto).
                Must belong to the authenticated user and be active.
            credit_card_id:
              type: string
              format: uuid
              description: Required when payment_method is credit_card. Must belong to the authenticated user and be active.
            source_account_id:
              type: string
              format: uuid
              description: Required when kind is transfer_between_accounts. Must belong to the authenticated user and be active.
            destination_account_id:
              type: string
              format: uuid
              description: |
                Required when kind is transfer_between_accounts. Must differ from source_account_id.
                Must belong to the authenticated user and be active.
            tag_ids:
              type: array
              items:
                type: string
                format: uuid
              description: Each tag must belong to the authenticated user and be active
    TransactionSuccessResponse:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        message:
          type: string
        data:
          $ref: '#/components/schemas/TransactionResource'
    SettledTransactionAttributes:
      type: object
      description: |
        One settled occurrence in the requested month.
        `id` is the settlement id. `transaction_id` is the parent transaction.
        `value` is the settled amount, not the transaction `current_value`.
        `account_id` is only included for account-based payment methods.
        `credit_card_id` and `limit_consumption_type` are only included when `payment_method` is `credit_card`.
        `source_account_id` and `destination_account_id` are only included when `kind` is `transfer_between_accounts`.
      properties:
        id:
          type: string
          format: uuid
          description: Settlement id
        transaction_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        kind:
          type: string
          enum:
            - income
            - expense
            - transfer_between_accounts
        status:
          type: string
          enum:
            - pending
            - active
            - completed
            - canceled
        payment_method:
          type: string
          nullable: true
          enum:
            - pix
            - debit
            - credit_card
            - ted
            - doc
            - deposit
            - cash
            - boleto
        recurrence_type:
          type: string
          enum:
            - one_time
            - installment
            - recurring
        installments_count:
          type: integer
          nullable: true
        ends_on:
          type:
            - string
            - 'null'
          format: date
        canceled_on:
          type:
            - string
            - 'null'
          format: date
        occurred_on:
          type: string
          format: date
          description: Business date of the settled occurrence. Used to select the calendar month.
        settled_on:
          type: string
          format: date
          description: Date the occurrence was processed.
        value:
          type: string
          description: Decimal amount as string (precision 15, scale 2) from the settlement
          example: '100.0'
        installment_number:
          type:
            - integer
            - 'null'
          description: Present for installment and recurring occurrences. Null for one-time.
        account_id:
          type: string
          format: uuid
          description: Present only for account-based payment methods.
        credit_card_id:
          type: string
          format: uuid
          description: Present only when `payment_method` is `credit_card`.
        limit_consumption_type:
          type: string
          enum:
            - upfront
            - monthly
          description: Present only when `payment_method` is `credit_card`.
        source_account_id:
          type: string
          format: uuid
          description: Present only when `kind` is `transfer_between_accounts`.
        destination_account_id:
          type: string
          format: uuid
          description: Present only when `kind` is `transfer_between_accounts`.
    SettledTransactionResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: settled_transaction
        attributes:
          $ref: '#/components/schemas/SettledTransactionAttributes'
    SettledTransactionCollection:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/SettledTransactionResource'
    TransactionUpdateRequest:
      type: object
      required:
        - transaction
      properties:
        transaction:
          type: object
          minProperties: 1
          properties:
            category_id:
              type: string
              format: uuid
            description:
              type: string
            kind:
              type: string
              enum:
                - income
                - expense
                - transfer_between_accounts
              description: Writable only when status is pending
            payment_method:
              type: string
              nullable: true
              enum:
                - pix
                - debit
                - credit_card
                - ted
                - doc
                - deposit
                - cash
                - boleto
              description: Writable only when status is pending
            recurrence_type:
              type: string
              enum:
                - one_time
                - installment
                - recurring
              description: Writable only when status is pending
            ends_on:
              type: string
              format: date
              nullable: true
              description: |
                Writable when status is pending, or when status is active and recurrence_type is recurring.
                Cleared automatically when recurrence_type is one_time.
                Must be on or after `starts_on`.
                For installment, must fall in a later month than `starts_on` so `installments_count` is greater than 1.
                When active, cannot be before the latest existing recurrence `starts_on`.
            starts_on:
              type: string
              format: date
              description: |
                Writable only when status is pending. Updates the existing recurrence in place.
                Write-only; the response exposes it on `recurrences`.
                Must be on or before `ends_on` when `ends_on` is present.
            value:
              type: number
              minimum: 0
              description: Writable only when status is pending. Updates the existing recurrence in place.
            limit_consumption_type:
              type: string
              nullable: true
              enum:
                - upfront
                - monthly
              description: |
                Writable only when status is pending.
                Ignored for one_time (always upfront) and recurring (always monthly).
                Required for installment unless the transaction already has a credit card limit consumption type.
            account_id:
              type: string
              format: uuid
              description: Writable when status is pending or active
            credit_card_id:
              type: string
              format: uuid
              description: Writable when status is pending or active
            source_account_id:
              type: string
              format: uuid
              description: Writable when status is pending or active
            destination_account_id:
              type: string
              format: uuid
              description: Writable when status is pending or active
            tag_ids:
              type: array
              items:
                type: string
                format: uuid
          description: |
            Partial update. Description, category, and tags are always writable.
            Account, card, source, destination, and recurring ends_on are writable unless status is completed or canceled.
            Kind, payment method, recurrence type, starts_on, value, and limit consumption are writable only when pending.
            `installments_count` is calculated and is not a request field.
            Completed and canceled accept only description, category_id, and tag_ids.
            Mutually exclusive payment fields are cleared to match the resulting kind and payment method.
            An already linked inactive category, account, card, or tag may be kept; a newly selected inactive one is rejected.
    TransactionRecurrenceRequest:
      type: object
      required:
        - transaction_recurrence
      properties:
        transaction_recurrence:
          type: object
          required:
            - starts_on
            - value
          properties:
            starts_on:
              type: string
              format: date
              description: |
                Month that should receive the new value.
                If a recurrence already exists in the same year-month, it is updated in place
                (including the day of `starts_on`).
                Otherwise a new recurrence is created for this date.
                Cannot be after the transaction `ends_on`.
            value:
              type: number
              minimum: 0
              description: |
                New amount for the given month.
                Must be different from the amount already applied by the previous recurrence.
                Cannot be changed when the transaction `limit_consumption_type` is `upfront`.
            change_for_next_months:
              type: boolean
              default: false
              description: |
                When `false` or omitted, only the given month is changed.
                If the next month already has a recurrence, it is kept; otherwise one is created
                with the previous amount, unless that next month would be after `ends_on`.
                Later recurrences are left unchanged.
                When `true`, the new amount applies from the given month onward and every later
                recurrence is removed.
                Allowed only when the transaction `status` is `active`.
    AuthenticationRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Presence is required. Minimum length is not enforced on sign-in.
        remember_me:
          type: boolean
          default: false
          description: |
            When `true`, the refresh cookie is persistent and the server-side refresh token lasts 30 days.
            When omitted or `false`, the cookie is a session cookie and the server-side token lasts 1 day.
            The cookie is httpOnly, `SameSite=Lax`, and `Secure` in production.
    UserAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        configs:
          type: object
          additionalProperties: true
          description: 'User preferences stored as JSON. Defaults to an empty object. Known key: `locale` (`en` or `pt-BR`).'
    UserResource:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
              const: user
            attributes:
              $ref: '#/components/schemas/UserAttributes'
    TokensData:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Session token (Bearer). Expires in 15 minutes.
        user:
          $ref: '#/components/schemas/UserResource'
    TokensSuccessResponse:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        data:
          $ref: '#/components/schemas/TokensData'
    RefreshSessionRequest:
      type: object
      properties:
        remember_me:
          type: boolean
          default: false
          description: |
            When `true`, the rotated refresh cookie is persistent and the server-side token lasts 30 days.
            When omitted or `false`, the cookie is a session cookie and the server-side token lasts 1 day.
            The `refresh_token` is read from the encrypted httpOnly cookie (`SameSite=Lax`; `Secure` in production), not from this body.
    RegistrationRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - password_confirmation
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    RegistrationSuccessResponse:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserResource'
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      properties:
        first_name:
          type: string
        last_name:
          type: string
        configs:
          type: object
          additionalProperties: true
          description: |
            Merged into the stored configs. Sent keys overwrite existing ones; keys that are not sent are kept.
            Can be sent alone, without `first_name` or `last_name`.
            Known key: `locale` (`en` or `pt-BR`). Other keys are stored as-is.
    AccountDeletionRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
    EmailConfirmationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    EmailChangeRequest:
      type: object
      required:
        - current_password
