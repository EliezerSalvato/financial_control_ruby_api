          required:
            - institution_id
            - default_payment_account_id
            - name
            - closing_day
            - due_day
            - network
          properties:
            institution_id:
              type: string
              format: uuid
            default_payment_account_id:
              type: string
              format: uuid
              description: Must reference an account owned by the authenticated user
            name:
              type: string
            total_limit:
              type: number
              minimum: 0
              default: 0
              description: Defaults to `0` when omitted. `available_limit` is initialized with the same value.
            closing_day:
              type: integer
              minimum: 1
              maximum: 31
            due_day:
              type: integer
              minimum: 1
              maximum: 31
            network:
              type: string
            allow_negative_available_limit:
              type: boolean
              default: false
              description: Defaults to `false` when omitted. When true, settlement may leave `available_limit` negative.
            active:
              type: boolean
              default: true
              description: Defaults to `true` when omitted
    CreditCardSuccessResponse:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        message:
          type: string
        data:
          $ref: '#/components/schemas/CreditCardResource'
    CreditCardInvoiceSettlementAttributes:
      type: object
      description: |
        One paid credit-card invoice whose `due_date` falls in the requested calendar month.
        `id` is the invoice settlement id. `total_value` is the amount debited from the payment account.
        `released_limit` is the amount added back to the card's available limit.
      properties:
        id:
          type: string
          format: uuid
          description: Invoice settlement id
        credit_card_id:
          type: string
          format: uuid
        payment_account_id:
          type: string
          format: uuid
          description: Account that paid the invoice
        opening_date:
          type: string
          format: date
          description: First day of the invoice cycle
        closing_date:
          type: string
          format: date
          description: Last day of the invoice cycle
        due_date:
          type: string
          format: date
          description: Invoice due date. Used to select the calendar month.
        total_value:
          type: string
          description: Decimal amount as string (precision 15, scale 2)
          example: '100.0'
        released_limit:
          type: string
          description: Decimal amount as string (precision 15, scale 2)
          example: '100.0'
        settled_on:
          type: string
          format: date
          description: Date the invoice was processed
    CreditCardInvoiceSettlementResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: credit_card_invoice_settlement
        attributes:
          $ref: '#/components/schemas/CreditCardInvoiceSettlementAttributes'
    CreditCardInvoiceSettlementCollection:
      type: object
      required:
        - status
        - type
        - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/CreditCardInvoiceSettlementResource'
    CreditCardUpdateRequest:
      type: object
      required:
        - credit_card
      properties:
        credit_card:
          type: object
          minProperties: 1
          properties:
            institution_id:
              type: string
              format: uuid
            default_payment_account_id:
              type: string
              format: uuid
            name:
              type: string
            total_limit:
              type: number
              minimum: 0
              description: |
                When changed, `available_limit` is adjusted by the same delta
                (`new_total_limit - old_total_limit`). Rejected if the resulting
                `available_limit` would be negative.
            network:
              type: string
            allow_negative_available_limit:
              type: boolean
            active:
              type: boolean
          description: |
            Partial update — only provided fields are changed.
            `closing_day` and `due_day` cannot be changed after create.
    MonthlyStatementAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Transaction id
        kind:
          type: string
          enum:
            - income
            - expense
          description: Transfer between accounts is never included in the statement
        description:
          type: string
        recurrence_type:
          type: string
          enum:
            - one_time
            - installment
            - recurring
        payment_method:
          type: string
          enum:
            - credit_card
            - account
          description: Statement grouping. `account` covers all account-based payment methods.
        resource_id:
          type: string
          format: uuid
          description: Credit card id or account id
        resource_name:
          type: string
          description: Credit card name or account name
        resource_brand:
          type: string
          description: |
            Credit card network, or institution `logo_key` for bank accounts
            (falls back to the account color when the institution has no logo).
            Cash accounts use the account color.
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date
        due_date:
          type:
            - string
            - 'null'
          format: date
          description: Present for credit cards. Always `null` for accounts.
        value:
          type: string
          description: Decimal amount as string (precision 15, scale 2) from the current recurrence
          example: '100.0'
        first_recurrence_on:
          type: string
          format: date
          description: Earliest `starts_on` across all recurrences of the transaction
        current_recurrence_on:
          type: string
          format: date
          description: |
            First recurrence day projected onto the period opening month. If that date is before
            `opening_date`, it advances one month. If that date is after `closing_date` and the previous
            month is shorter than the cycle closing day, it moves to the day after that previous
            month's last day. The day is clamped to the last day of the month when needed. Never
            precedes `first_recurrence_on`. Recurring items are omitted when this date is outside the
            period.
        starts_on:
          type: string
          format: date
          description: '`starts_on` of the current recurrence'
        ends_on:
          type:
            - string
            - 'null'
          format: date
        canceled_on:
          type:
            - string
            - 'null'
          format: date
          description: Set when the transaction is canceled. Null otherwise.
    MonthlyStatementResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: monthly_statement
        attributes:
          $ref: '#/components/schemas/MonthlyStatementAttributes'
    MonthlyStatementCollection:
