        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: |
        Returns a paginated list of transactions for the authenticated user. Supports Ransack filters via `q`.
        List items include recurrences and `current_value`.
        Payment targets that apply to the item are present as `null`; targets that do not apply are omitted.
        `tag_ids` is always `null` on list. Use show to read populated payment targets and tags.
      operationId: listTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: q[id_eq]
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by transaction id
        - name: q[description_cont]
          in: query
          required: false
          schema:
            type: string
          description: Filter transactions whose description contains the given value
        - name: q[kind_eq]
          in: query
          required: false
          schema:
            type: string
            enum:
              - income
              - expense
              - transfer_between_accounts
          description: Filter by kind
        - name: q[status_eq]
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - active
              - completed
              - canceled
          description: Filter by status
        - name: q[payment_method_eq]
          in: query
          required: false
          schema:
            type: string
            enum:
              - pix
              - debit
              - credit_card
              - ted
              - doc
              - deposit
              - cash
              - boleto
          description: Filter by payment method
        - name: q[recurrence_type_eq]
          in: query
          required: false
          schema:
            type: string
            enum:
              - one_time
              - installment
              - recurring
          description: Filter by recurrence type
        - name: q[category_id_eq]
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by category id
        - name: q[installments_count_eq]
          in: query
          required: false
          schema:
            type: integer
          description: Filter by installments count
        - name: q[created_at_gteq]
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter transactions created on or after the given datetime
        - name: q[created_at_lteq]
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter transactions created on or before the given datetime
        - name: q[ends_on_gteq]
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter transactions whose ends_on is on or after the given date
        - name: q[ends_on_lteq]
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter transactions whose ends_on is on or before the given date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: status, created_at desc
          description: Sort expression (default `status, created_at desc`)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Transactions listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Transactions
      summary: Create transaction
      description: |
        Creates a new transaction for the authenticated user.
        `installments_count` is calculated from `recurrence_type`, `starts_on`, and `ends_on`.
        `status` is always set to `pending` and cannot be provided.
        `starts_on` is write-only on the request; the response exposes it on each item in `recurrences`.
        Category, tags, account, and credit card must belong to the authenticated user and be active.
        A date that belongs to a closed month is rejected with 422 (`monthly_status_closed` on `base`).
        A date in a missing month that precedes an already closed month is rejected with 422 (`later_month_closed` on `base`).
        Credit card transactions use the card billing cycle month, not the civil month of `starts_on`.
        A credit card expense whose dates overlap a paid invoice is rejected with 422 (`invoice_already_paid` on `base`).
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              transaction:
                description: Grocery shopping
                kind: expense
                payment_method: pix
                recurrence_type: one_time
                starts_on: '2026-08-11'
                value: 100
                account_id: 018f1a2b-3c4d-7e8f-9a0b-1c2d3e4f5a6b
                category_id: 018f1a2b-3c4d-7e8f-9a0b-1c2d3e4f5a6c
                tag_ids:
                  - 018f1a2b-3c4d-7e8f-9a0b-1c2d3e4f5a6d
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/transactions/settled:
    get:
      tags:
        - Transactions
      summary: List settled transactions
      description: |
        Returns the authenticated user's transaction occurrences that were settled in the given calendar month.
        An item is included when it has a settlement whose `occurred_on` falls in that month.
        Pending transactions without a settlement are not included.
        Recurring and installment transactions appear once per settled occurrence in the month.
        Each item exposes the settlement amount and dates (`occurred_on`, `settled_on`, `value`, `installment_number`)
        together with the transaction identity and payment target.
        Income, expense, and transfers between accounts are included.
        Optional `type` limits the list to one payment target (`account`, `credit_card`, or `transfer_between_accounts`).
        Missing or out-of-range `month`/`year` return **422**.
      operationId: listSettledTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Calendar month of the settlement occurrence (1-12)
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          description: Calendar year of the settlement occurrence
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - account
              - credit_card
              - transfer_between_accounts
          description: |
            Filter by payment target. When omitted, account, credit card, and transfer settlements are all included.
      responses:
        '200':
          description: Settled transactions listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettledTransactionCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Show transaction
      description: Returns a single transaction owned by the authenticated user, including payment targets, tags, and recurrences.
      operationId: showTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Transactions
      summary: Update transaction
      description: |
        Updates an existing transaction owned by the authenticated user.
        Editable fields depend on `status` (see `TransactionUpdateRequest`).
        When pending, `starts_on` and `value` update the existing recurrence in place.
        `starts_on` is write-only on the request; the response exposes it on each item in `recurrences`.
        `status` cannot be changed.
        Moving a credit card expense onto a paid invoice (via `starts_on`, `ends_on`, `credit_card_id`, `payment_method`, or `recurrence_type`) is rejected with 422 (`invoice_already_paid` on `base`).
      operationId: updateTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdateRequest'
            example:
              transaction:
                description: Grocery shopping (updated)
                value: 120
                starts_on: '2026-10-11'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Transactions
      summary: Delete transaction
      description: |
        Deletes a pending transaction owned by the authenticated user, including dependents.
        Active, completed, and canceled transactions are rejected.
        To cancel an active transaction, use `POST /api/v1/transactions/{id}/cancel`.
      operationId: deleteTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/transactions/{id}/cancel:
    post:
      tags:
        - Transactions
      summary: Cancel transaction
      description: |
        Cancels an active transaction owned by the authenticated user by setting `status` to `canceled`
        and `canceled_on` to the current date.
        Pending, completed, and already canceled transactions are rejected.
        To delete a pending transaction, use `DELETE /api/v1/transactions/{id}`.
      operationId: cancelTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Transaction canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/transactions/{transaction_id}/recurrences:
    post:
      tags:
        - Transactions
      summary: Create or split a transaction recurrence
      description: |
        Adds a value change to a recurring or installment transaction owned by the authenticated user.

        Recurrences apply from `starts_on` until the next recurrence, and the response lists them ordered by `starts_on`.
        If a recurrence already exists in the same year-month as `starts_on`, it is updated in place
        (including the day of `starts_on`); otherwise a new recurrence is created.

        Allowed only when `status` is `active`. `starts_on` cannot be after the transaction `ends_on`.
        `value` must be different from the amount already applied by the previous recurrence.
        Pending, completed, and canceled transactions are rejected. One-time transactions are rejected.
        Credit card installments with `limit_consumption_type` `upfront` cannot change recurrence values.

        When `change_for_next_months` is omitted or `false`, only the given month is changed.
        If the next month already has a recurrence, it is kept; otherwise a recurrence is created
        for the next month with the previous amount, unless that next month would be after `ends_on`.
        All other recurrences are left unchanged.

        When `change_for_next_months` is `true`, the given month is updated and every later
        recurrence is removed so the new amount applies from that month onward.
      operationId: createTransactionRecurrence
      security:
        - bearerAuth: []
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Transaction UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRecurrenceRequest'
            examples:
              currentMonthOnly:
                summary: Change only the given month
                value:
                  transaction_recurrence:
                    value: 120
                    starts_on: '2026-01-01'
              currentAndNextMonths:
                summary: Change the given month and all following months
                value:
                  transaction_recurrence:
                    value: 120
                    starts_on: '2026-01-01'
                    change_for_next_months: true
      responses:
        '200':
          description: Recurrence created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/authentications:
    post:
      tags:
        - Authentication
      summary: Sign in
      description: |
        Authenticates with email and password.
        The user must be **verified** and **active**.
        Returns a short-lived session `token` in the JSON body and sets an encrypted
        httpOnly `refresh_token` cookie (`SameSite=Lax`; `Secure` in production). The refresh token is never
        returned in the JSON body. Optional `remember_me` controls cookie and refresh lifetime.
        When a valid `locale` cookie is present and differs from `configs.locale`, the user's
        locale is updated to match the cookie. Other config keys are kept.
        Sign in **revokes every previous refresh session** for that user, so only the new refresh
        cookie is valid. An older Bearer token remains valid until it expires (15 minutes).
      operationId: createAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
            examples:
              default:
                summary: Session cookie (1 day server-side)
                value:
                  email: john.doe@example.com
                  password: password123
              rememberMe:
                summary: Persistent refresh cookie (30 days)
                value:
                  email: john.doe@example.com
                  password: password123
                  remember_me: true
      responses:
        '200':
          description: Authenticated. Sets the encrypted httpOnly `refresh_token` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Encrypted httpOnly `refresh_token` cookie (`SameSite=Lax`; `Secure` in production).
                Session cookie by default. Persistent (30 days) when `remember_me` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensSuccessResponse'
              example:
                status: success
                type: object
                data:
                  token: eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaEpJaWs9IiwiZXhwIjpudWxsLCJwdXIiOiJzZXNzaW9uX3Rva2VuIn19--abc
                  user:
                    data:
                      id: 019abc...
                      type: user
                      attributes:
                        id: 019abc...
                        first_name: John
                        last_name: Doe
                        email: john.doe@example.com
                        configs: {}
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/session/refreshes:
    patch:
      tags:
        - Authentication
      summary: Refresh session
      description: |
        Reads the encrypted httpOnly `refresh_token` cookie and returns a new session `token`.
        Rotates the refresh cookie. Does not require the Bearer header.
        Optional `remember_me` in the body controls the rotated cookie lifetime.
      operationId: refreshSession
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
          description: Encrypted httpOnly refresh token cookie set on sign in
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            example:
              remember_me: true
      responses:
        '200':
          description: Session token rotated. Sets a new encrypted httpOnly `refresh_token` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Rotated encrypted httpOnly `refresh_token` cookie (`SameSite=Lax`; `Secure` in production).
                Session cookie by default. Persistent (30 days) when `remember_me` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensSuccessResponse'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/session/revokes:
    delete:
      tags:
        - Authentication
      summary: Revoke all sessions
      description: |
        Invalidates all active refresh sessions for the authenticated user.
        The current Bearer token remains valid until it expires (15 minutes).
        The `refresh_token` cookie is not deleted; the next refresh attempt fails until the user signs in again.
      operationId: revokeSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/registrations:
    post:
      tags:
        - User
      summary: Register a new user
      description: |
        Creates a user (unverified) and enqueues an email confirmation message.
        After registration, confirm the email before signing in.
      operationId: createRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              first_name: John
              last_name: Doe
              email: john.doe@example.com
              password: password123
              password_confirmation: password123
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSuccessResponse'
              example:
                status: success
                type: object
                data:
                  user:
                    data:
                      id: 019abc...
                      type: user
                      attributes:
                        id: 019abc...
                        first_name: John
                        last_name: Doe
                        email: john.doe@example.com
                        configs: {}
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/profiles:
    patch:
      tags:
        - User
      summary: Update profile
      description: |
        Partially updates the authenticated user's profile. Send any combination of `first_name`, `last_name`, and `configs`.
        `configs` is merged into the stored JSON: sent keys overwrite existing ones, and other keys are kept.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            examples:
              names:
                summary: Update names
                value:
                  first_name: Jane
                  last_name: Smith
              configs:
                summary: Merge configs without changing names
                value:
                  configs:
                    locale: pt-BR
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/accounts:
    delete:
      tags:
        - User
      summary: Delete account
      description: Permanently deletes the authenticated user. Requires the current password.
      operationId: deleteUserAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
            example:
              password: password123
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/email/confirmations:
    post:
      tags:
        - User
      summary: Confirm email
      description: Confirms the user email with the token received by email. Public endpoint.
      operationId: confirmEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmationRequest'
            example:
              token: confirmation-token-from-email
      responses:
        '200':
          description: Email confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/email/changes:
    patch:
      tags:
        - User
      summary: Change email
      description: |
        Changes the email of the authenticated user.
        Requires the current password. Marks the user as unverified and sends a new confirmation email.
        Revokes all refresh sessions. The current Bearer token remains valid until it expires
        (the user stays authenticated on this request). The `refresh_token` cookie is not deleted.
        Sign in with the new email is blocked until the user confirms it.
      operationId: changeEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              current_password: password123
              new_email: new.email@example.com
      responses:
        '200':
          description: Email change initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/password/changes:
    patch:
      tags:
        - User
      summary: Change password
      description: |
        Changes the password of the authenticated user. Requires the current password.
        Revokes all refresh sessions. The current Bearer token remains valid until it expires.
        The `refresh_token` cookie is not deleted.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              current_password: password123
              password: new-password123
              password_confirmation: new-password123
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/password/resets:
    post:
      tags:
        - User
      summary: Request password reset
      description: |
        Sends password reset instructions to the given email.
        The user must exist, be **active**, and have a verified email. Public endpoint.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: john.doe@example.com
      responses:
        '200':
          description: Reset instructions sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - User
      summary: Reset password
      description: |
        Sets a new password using the token from the reset email. Public endpoint.
        Revokes all refresh sessions. Any Bearer token already issued remains valid until it expires.
        The `refresh_token` cookie is not deleted.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetUpdateRequest'
            example:
              token: reset-token-from-email
              password: new-password123
              password_confirmation: new-password123
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed session token
      description: |
        Session token returned in the JSON body by `POST /api/v1/user/authentications`
        or `PATCH /api/v1/user/session/refreshes`. The refresh token is an encrypted
        httpOnly cookie (`SameSite=Lax`; `Secure` in production), not a Bearer header.

        ```http
        Authorization: Bearer <token>
        ```
  responses:
    BadRequest:
      description: Invalid request parameters or filters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Invalid request
            details: {}
    Unauthorized:
      description: Missing or invalid Bearer token, or a valid token for an inactive user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Unauthorized
            details: {}
    UnprocessableContent:
      description: Validation or business rule failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Email has already been taken
            details:
              email:
                - has already been taken
    TooManyRequests:
      description: |
        Rate limit exceeded. Body is Rack::Attack's default `text/plain` (`Retry later`),
        not the JSON error envelope. See the Rate limiting section in the API description.
      content:
        text/plain:
          schema:
            type: string
            example: |
              Retry later
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Not found
            details: {}
    InternalServerError:
      description: |
        Unexpected failure. Uses the JSON error envelope.
        In production the message is a generic internal-server-error string;
        outside production it is the exception message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Internal Server Error
            details: {}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID
  schemas:
    TagAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: ^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$
          description: Hex color (`#RRGGBB` or `#RRGGBBAA`)
          example: '#3B82F6'
        active:
          type: boolean
    TagResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: tag
        attributes:
          $ref: '#/components/schemas/TagAttributes'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        count:
          type: integer
        pages:
          type: integer
        next_page:
          type:
            - integer
            - 'null'
        prev_page:
          type:
            - integer
            - 'null'
    TagCollection:
      type: object
      required:
        - status
        - type
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ErrorResponse:
      type: object
