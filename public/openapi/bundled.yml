  /api/v1/monthly_statements:
    get:
      tags:
        - Monthly Statements
      summary: List monthly statement items
      description: |
        Returns the authenticated user's transactions that belong to the given calendar month.
        Credit card items use the card billing cycle for that month (`opening_date`, `closing_date`, `due_date`).
        `opening_date` is the day after the previous cycle's closing date (clamped when the closing day
        does not exist in that month). Account items use the first and last days of the month and have no `due_date`.
        `payment_method` is `credit_card` or `account`. `value` and `starts_on` come from the latest recurrence
        whose `starts_on` is on or before the period closing date. `first_recurrence_on` is the earliest
        `starts_on` across all recurrences of the transaction. `current_recurrence_on` is that first
        recurrence day projected onto the period opening month. If that date is before `opening_date`,
        it advances one month. If that date is after `closing_date` and the previous month is shorter
        than the cycle closing day, it moves to the day after that previous month's last day so it
        falls in the current cycle. It never precedes `first_recurrence_on`. Recurring and installment items
        are included when `current_recurrence_on` falls in the period and `ends_on` is null or
        `current_recurrence_on` is on or before `ends_on`. If that date was shifted to `opening_date`
        because the projected day falls after `closing_date`, the item is still included when
        `opening_date` is the day after `ends_on`.
        Transfers between accounts are not included.
        Pending, active, and completed transactions are included. Transactions canceled before
        `current_recurrence_on` are not included. Included canceled transactions expose `canceled_on`.
        Missing or out-of-range `month`/`year` return **422**.
      operationId: listMonthlyStatements
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Calendar month of the statement (1-12)
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          description: Calendar year of the statement
      responses:
        '200':
          description: Monthly statement items listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyStatementCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/monthly_statements/transfers:
    get:
      tags:
        - Monthly Statements
      summary: List monthly statement transfers
      description: |
        Returns the authenticated user's transfers between accounts that belong to the given calendar month.
        Items use the first and last days of the month as `opening_date` and `closing_date`.
        Each item exposes the source and destination accounts (`id`, `name`, and `brand`).
        `brand` is the institution `logo_key` for bank accounts (falls back to the account color when the
        institution has no logo). Cash accounts use the account color.
        `value` and `starts_on` come from the latest recurrence whose `starts_on` is on or before the
        period closing date. `first_recurrence_on` is the earliest `starts_on` across all recurrences of
        the transfer. `current_recurrence_on` is that first recurrence day projected onto the period
        opening month. If that date is before `opening_date`, it advances one month. If that date is
        after `closing_date` and the previous month is shorter than the period closing day, it moves to
        the day after that previous month's last day so it falls in the current period. It never
        precedes `first_recurrence_on`. Recurring and installment items are included when
        `current_recurrence_on` falls in the period and `ends_on` is null or `current_recurrence_on` is
        on or before `ends_on`. If that date was shifted to `opening_date` because the projected day
        falls after `closing_date`, the item is still included when `opening_date` is the day after
        `ends_on`.
        Income, expense, and credit card transactions are not included.
        Pending, active, and completed transfers are included. Transfers canceled before
        `current_recurrence_on` are not included. Included canceled transfers expose `canceled_on`.
        Missing or out-of-range `month`/`year` return **422**.
      operationId: listMonthlyStatementTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Calendar month of the statement (1-12)
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          description: Calendar year of the statement
      responses:
        '200':
          description: Monthly statement transfers listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyStatementTransferCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/monthly_statuses:
    get:
      tags:
        - Monthly Statuses
      summary: Show monthly status
      description: |
        Returns the authenticated user's monthly status for the given calendar month.
        Identity is `(user, month, year)`, not a UUID. `user` is always the current user.
        If no row exists, the API returns 404 without creating a record.
        Missing or out-of-range `month`/`year` return **422**.

        Processing updates (`processing` and `last_processed_at`) are also pushed over Action Cable
        on `MonthlyStatusChannel`. See the WebSockets section in the API description.
      operationId: showMonthlyStatus
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Calendar month (1-12)
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          description: Calendar year
      responses:
        '200':
          description: Monthly status found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyStatusSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Monthly Statuses
      summary: Update monthly status
      description: |
        Closes or reopens the authenticated user's month. Identity is `(user, month, year)`,
        not a UUID. `user` is always the current user.
        If no row exists, one is created and then updated, so a missing month can be closed
        in a single request. A missing month that precedes an already closed month is rejected
        with 422 (`later_month_closed` on `base`) and is not created.
        Sending the already persisted `status` is idempotent (200).
      operationId: updateMonthlyStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyStatusUpdateRequest'
            example:
              monthly_status:
                month: 8
                year: 2026
                status: closed
      responses:
        '200':
          description: Monthly status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyStatusSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/settlements/processing:
    post:
      tags:
        - Settlements
      summary: Enqueue settlement processing
      description: |
        Accepts a settlement request and returns **202** immediately. HTTP does not validate `month`,
        `year`, or `reference_date` beyond requiring the `settlement` wrapper (missing wrapper → 400).

        A background job is enqueued unless that calendar month is already `processing`. In that case
        the response is still 202 with the same queued message, and no new job is enqueued.

        The job processes due occurrences, transfers, and credit-card invoices for the authenticated
        user in the given calendar month.

        For the current month, `reference_date` must be today or yesterday. For a past month, `reference_date`
        is ignored and the last day of that month is used. Future months are rejected by the job.

        The job also rejects a month when the previous calendar month still has an open `monthly_status`.
        If that previous month has no open row (missing or already closed), processing may start.

        A month that precedes a closed `monthly_status` is also rejected. Later open or missing months
        do not block processing.

        Those domain rules and item failures (insufficient balance or limit) run asynchronously.
        They become notifications; they do not appear on this HTTP response.
      operationId: processSettlements
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementProcessingRequest'
            example:
              settlement:
                month: 8
                year: 2026
                reference_date: '2026-08-28'
      responses:
        '202':
          description: |
            Accepted. A job is enqueued unless the month is already processing.
            The message is the same in both cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
              example:
                status: success
                message: Settlement processing has been queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: |
        Returns the authenticated user's notifications in infinite-scroll order (`id` descending, UUID v7).
        Pagination is keyset-based: pass `meta.next_cursor` from the previous response as `after`.
        Unread count is exposed in `meta.unread_count`. Pass `unread=true` to return only unread notifications.
        There is no `sort` parameter.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from `meta.next_cursor`. Omit to fetch the newest page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, returns only unread notifications. `meta.unread_count` remains the total unread count.
      responses:
        '200':
          description: Notifications listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/notifications/{id}:
    get:
      tags:
