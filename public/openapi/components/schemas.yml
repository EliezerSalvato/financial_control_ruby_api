TagRequest:
  type: object
  required: [tag]
  properties:
    tag:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Hex color (`#RRGGBB` or `#RRGGBBAA`)
          example: "#3B82F6"
        active:
          type: boolean
          default: true
          description: Defaults to `true` when omitted

TagUpdateRequest:
