AuthenticationRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
    remember_me:
      type: boolean
      default: false
      description: |
        When `true`, the refresh cookie is persistent and the server-side refresh token lasts 30 days.
        When omitted or `false`, the cookie is a session cookie and the server-side token lasts 1 day.

RegistrationRequest:
  type: object
  required: [first_name, last_name, email, password, password_confirmation]
  properties:
    first_name:
      type: string
    last_name:
      type: string
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
    password_confirmation:
      type: string
      format: password

RefreshSessionRequest:
  type: object
  properties:
    remember_me:
      type: boolean
      default: false
      description: |
        When `true`, the rotated refresh cookie is persistent and the server-side token lasts 30 days.
        When omitted or `false`, the cookie is a session cookie and the server-side token lasts 1 day.
        The `refresh_token` is read from the encrypted httpOnly cookie, not from this body.

ProfileUpdateRequest:
  type: object
  required: [first_name, last_name]
  properties:
    first_name:
      type: string
    last_name:
      type: string

AccountDeletionRequest:
  type: object
  required: [password]
  properties:
    password:
      type: string
      format: password

EmailConfirmationRequest:
  type: object
  required: [token]
  properties:
    token:
      type: string

EmailChangeRequest:
  type: object
  required: [current_password, new_email]
  properties:
    current_password:
      type: string
      format: password
    new_email:
      type: string
      format: email

PasswordChangeRequest:
  type: object
  required: [current_password, password, password_confirmation]
  properties:
    current_password:
      type: string
      format: password
    password:
      type: string
      format: password
      minLength: 8
    password_confirmation:
      type: string
      format: password

PasswordResetRequest:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email

PasswordResetUpdateRequest:
  type: object
  required: [token, password, password_confirmation]
  properties:
    token:
      type: string
    password:
      type: string
      format: password
      minLength: 8
    password_confirmation:
      type: string
      format: password

TokensData:
