    id:
      type: string
      format: uuid
    name:
      type: string
    color:
      type: string
      pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
      description: Hex color (`#RRGGBB` or `#RRGGBBAA`)
      example: "#3B82F6"
    active:
      type: boolean

TagResource:
  type: object
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      const: tag
    attributes:
