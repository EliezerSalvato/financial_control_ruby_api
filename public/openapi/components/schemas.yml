        institution_id:
          type: string
          format: uuid
          description: Required when `kind` is `bank_account`; not permitted for `cash`
        bank_account_type:
          $ref: "#/BankAccountType"
          description: Required when `kind` is `bank_account`; not permitted for `cash`
        current_balance:
          type: number
          default: 0
          description: Defaults to `0` when omitted
        color:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
