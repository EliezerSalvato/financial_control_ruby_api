openapi: 3.1.0
info:
  title: API Ruby de Controle Financeiro
  version: 1.0.30
  description: |
    ## Autenticação

    Endpoints protegidos exigem um **token de sessão Bearer** no header `Authorization`:

    ```http
    Authorization: Bearer <token>
    ```

    ### Fluxo

    1. **Registrar** — `POST /api/v1/user/registrations`
    2. **Confirmar e-mail** — `POST /api/v1/user/email/confirmations` (token do e-mail)
    3. **Entrar** — `POST /api/v1/user/authentications` → `token` no corpo JSON; `refresh_token` é definido como cookie httpOnly criptografado (`SameSite=Lax`; `Secure` em produção). O `remember_me` opcional controla a duração do cookie e do refresh. O login **revoga todas as sessões de refresh anteriores**. Um token Bearer mais antigo permanece válido até expirar (15 minutos)
    4. **Chamar endpoints protegidos** com `Authorization: Bearer <token>`. Um token válido de um usuário **inativo** também é **401**
    5. **Atualizar** — quando o token de sessão expira, `PATCH /api/v1/user/session/refreshes` (lê o cookie `refresh_token`; `remember_me` opcional no corpo)
    6. **Revogar** — `DELETE /api/v1/user/session/revokes` para invalidar todas as sessões ativas (Bearer obrigatório). Não limpa o cookie `refresh_token`. Alteração de senha, redefinição de senha e alteração de e-mail também revogam sessões de refresh sem excluir o cookie

    ### Duração dos tokens

    | Token | Duração |
    |-------|----------|
    | Sessão (`token`) | 15 minutos |
    | Cookie de refresh (`remember_me: true`) | 30 dias |
    | Cookie de refresh (sem `remember_me`) | cookie de sessão / 1 dia no servidor |
    | Confirmação de e-mail | 24 horas |
    | Redefinição de senha | 15 minutos |

    ### Público vs protegido

    | Acesso | Endpoints |
    |--------|-----------|
    | Público | registrations, authentications, email confirmations, password resets, session refreshes |
    | Bearer obrigatório | tags, categories, institutions, accounts, credit cards, monthly statements, goals, monthly statuses, settlements, transactions, notifications, profiles, account deletion, email changes, password changes, session revokes |
    | Token de sessão (query ou `Authorization`) | Action Cable em `/cable` (`MonthlyStatusChannel`, `NotificationChannel`) |

    ---

    ## WebSockets

    O Action Cable está montado em `/cable`. Use o mesmo token de sessão da API REST:

    ```
    ws://localhost:3000/cable?token=<token>
    ```

    Clientes nativos podem enviar `Authorization: Bearer <token>` no handshake do WebSocket em vez do parâmetro de query.

    O handshake é rejeitado quando o token está ausente ou inválido, ou quando o usuário está inativo.

    Inscreva-se em um mês civil pertencente ao usuário atual:

    ```json
    { "channel": "MonthlyStatusChannel", "month": 8, "year": 2026 }
    ```

    A linha de status mensal já deve existir (mesma identidade de `GET /api/v1/monthly_statuses`). Caso contrário, a inscrição é rejeitada.

    Na inscrição, e sempre que a coluna `processing` mudar, o servidor envia:

    ```json
    { "processing": true, "last_processed_at": null }
    ```

    `last_processed_at` é um timestamp ISO 8601, ou `null` quando o mês nunca concluiu uma execução de processamento.

    Inscreva-se no stream de notificações do usuário atual (sem parâmetros):

    ```json
    { "channel": "NotificationChannel" }
    ```

    Não há payload inicial na inscrição. O cliente carrega a contagem de não lidas e a primeira página via `GET /api/v1/notifications`.

    Quando uma única notificação é criada, o servidor envia o kind da notificação, o recurso JSON:API e a contagem atual de não lidas:

    ```json
    {
      "kind": "transaction.validation.errors",
      "notification": {
        "id": "0199...",
        "type": "notification",
        "attributes": { "id": "0199...", "kind": "transaction.validation.errors", "title": "...", "read": false }
      },
      "unread_count": 7
    }
    ```

    Quando um job cria várias notificações para o mesmo usuário, o servidor envia um evento de grupo sem o recurso. Os kinds em lote hoje são `settlement.errors` e `monthly_status.errors`:

    ```json
    { "kind": "settlement.errors", "unread_count": 7 }
    ```

    Distinga os dois pela presença de `notification`. Se estiver presente, o item pode ser inserido no topo da lista. Se estiver ausente, atualize o badge a partir de `unread_count` e busque de novo `GET /api/v1/notifications`.

    ---

    ## Locale

    Quando a requisição está autenticada, as mensagens da API seguem esta ordem:

    1. `configs.locale` do usuário atual (`en` ou `pt-BR`)
    2. Padrão: inglês (`en`)

    Cookie e `Accept-Language` são ignorados enquanto o usuário está autenticado.

    Quando a requisição não está autenticada, as mensagens da API seguem esta ordem:

    1. Cookie `locale` (`en` ou `pt-BR`)
    2. Header `Accept-Language` (`pt-BR`, `pt`, `en`, …)
    3. Padrão: inglês (`en`)

    A API lê o cookie `locale`; ela não o define. O cliente deve definir o cookie quando
    quiser mensagens não autenticadas em um determinado locale.

    No login (`POST /api/v1/user/authentications`), se um cookie `locale` válido estiver presente
    e diferir de `configs.locale` do usuário, o locale armazenado é atualizado para corresponder ao cookie.

    ---

    ## Envelope de resposta

    Sucesso:

    ```json
    { "status": "success", "type": "object", "data": {}, "message": "optional" }
    ```

    Erro:

    ```json
    { "status": "error", "message": "...", "details": { "field": ["..."] } }
    ```

    Falhas inesperadas em `/api/v1` retornam **500** com esse envelope JSON. Em produção a mensagem é uma string genérica de internal-server-error; fora de produção é a mensagem da exceção.

    Respostas de limite de taxa (**429**) **não** são JSON. São o corpo `text/plain` padrão do Rack::Attack (`Retry later`).

    ---

    ## Limitação de taxa

    Todos os endpoints HTTP, exceto `/up` e `/cable` (qualquer método), são limitados:

    | Escopo | Limite |
    |-------|-------|
    | Geral | 300 requisições / 5 minutos por IP, token Bearer hasheado e id do usuário |
    | Endpoints de autenticação | 10 requisições / 1 minuto |

    Throttles dedicados de autenticação se aplicam a:

    - `POST /api/v1/user/authentications` (por IP e e-mail)
    - `POST /api/v1/user/registrations` (por IP e e-mail)
    - `POST /api/v1/user/password/resets` (por IP e e-mail)
    - `PATCH /api/v1/user/password/resets` (por IP e token)
    - `PATCH /api/v1/user/session/refreshes` (por IP e cookie de refresh)

    Toda operação documenta **429**. Confirmação de e-mail, alteração de senha, alteração de e-mail e revogação de sessão usam apenas o throttle geral.

    ---

    ## Fuso horário

    A API usa `America/Sao_Paulo`. Meses civis, `reference_date` de liquidação e jobs recorrentes de produção seguem esse fuso.

    Jobs de produção (`config/recurring.yml`):

    - Liquidar meses abertos diariamente às 03:00
    - Fechar meses abertos anteriores às 05:00 no dia 1
    - Limpar jobs Solid Queue finalizados a cada hora no minuto 12

    ---

    ## Outras superfícies HTTP

    Estas não são operações OpenAPI:

    | Path | Propósito |
    |------|---------|
    | `GET /up` | Health check do Rails |
    | `GET /docs` | UI Redoc (seletor de idioma: `en` / `pt-BR`, ou `?lang=`) |
    | `/openapi/*` | Arquivos OpenAPI estáticos (`bundled.yml`, `bundled.pt-BR.yml`) |
    | `/jobs` | Mission Control Jobs (HTTP basic auth) |
    | `/cable` | Action Cable (veja WebSockets) |
servers:
- url: http://localhost:3000
  description: Desenvolvimento local
tags:
- name: Autenticação
  description: Entrar, atualizar sessão e revogar sessões
- name: Usuário
  description: Registro, perfil, conta, e-mail e senha
- name: Tags
  description: Rótulos do usuário para categorizar transações, com metas mensais opcionais
- name: Categorias
  description: Categorias do usuário para organizar transações, com metas mensais
    opcionais
- name: Instituições
  description: Instituições financeiras do usuário
- name: Contas
  description: Contas financeiras do usuário (contas bancárias e dinheiro)
- name: Cartões de crédito
  description: Cartões de crédito do usuário
- name: Transações
  description: Transações financeiras do usuário (receitas, despesas e transferências)
- name: Extratos mensais
  description: Itens do extrato mensal para contas, cartões de crédito e transferências
    entre contas
- name: Metas
  description: Transações mensais e valores de metas de categoria/tag para o painel
    de metas
- name: Status mensais
  description: Status aberto ou fechado de um mês civil do usuário autenticado, incluindo
    atualizações de processamento via Action Cable
- name: Liquidações
  description: Enfileirar o processamento de ocorrências de transação, transferências
    e faturas de cartão de crédito vencidas
- name: Notificações
  description: Notificações do usuário com paginação por cursor, contagem de não lidas
    e entrega em tempo real via Action Cable
paths:
  "/api/v1/tags":
    get:
      tags:
      - Tags
      summary: Listar tags
      description: Retorna uma lista paginada de tags do usuário autenticado. Suporta
        filtros Ransack via `q`.
      operationId: listTags
      security:
      - bearerAuth: []
      parameters:
      - name: q[name_cont]
        in: query
        required: false
        schema:
          type: string
        description: Filtrar tags cujo nome contém o valor informado
      - name: q[active_eq]
        in: query
        required: false
        schema:
          type: boolean
        description: Filtrar por flag ativo
      - name: sort
        in: query
        required: false
        schema:
          type: string
          example: name asc
        description: Expressão de ordenação (padrão `active desc, name asc`)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Tags listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TagCollection"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    post:
      tags:
      - Tags
      summary: Criar tag
      description: Cria uma nova tag para o usuário autenticado. `goal_starts_on`
        e `goal_value` opcionais iniciam uma meta; `goal_ends_on` é opcional.
      operationId: createTag
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TagRequest"
            example:
              tag:
                name: Vacation
                color: "#3B82F6"
                active: true
      responses:
        '201':
          description: Tag criada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TagSuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/tags/{id}":
    get:
      tags:
      - Tags
      summary: Exibir tag
      description: Retorna uma única tag pertencente ao usuário autenticado.
      operationId: showTag
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Tag encontrada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TagSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    patch:
      tags:
      - Tags
      summary: Atualizar tag
      description: Atualiza uma tag existente pertencente ao usuário autenticado.
        `goal_ends_on` encerra uma meta existente. `goal_starts_on` e `goal_value`
        iniciam uma meta apenas quando nenhuma existe.
      operationId: updateTag
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TagUpdateRequest"
            example:
              tag:
                name: Vacation
                color: "#10B981"
                active: false
      responses:
        '200':
          description: Tag atualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TagSuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    delete:
      tags:
      - Tags
      summary: Excluir tag
      description: Exclui uma tag pertencente ao usuário autenticado.
      operationId: deleteTag
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Tag excluída
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/tags/{tag_id}/goals":
    patch:
      tags:
      - Tags
      summary: Atualizar ou dividir uma meta de tag
      description: |
        Adiciona uma alteração de valor a uma meta de tag pertencente ao usuário autenticado.

        As metas se aplicam desde o mês de `starts_on` até a próxima meta, e a resposta as lista ordenadas por ano e mês.
        Apenas o ano e o mês de `starts_on` são persistidos. Se já existir uma meta naquele year-month, ela é atualizada;
        caso contrário, uma nova meta é criada.
        É assim também que a primeira meta é iniciada quando a tag não tem nenhuma.

        `starts_on` não pode ser após `goal_ends_on`. `value` deve ser diferente do valor já
        aplicado pela meta anterior. Meses passados e fechados são permitidos.

        Quando `change_for_next_months` é omitido ou `false`, apenas o mês informado é alterado.
        Se o próximo mês já tem uma meta, ela é mantida; caso contrário, uma meta é criada
        para o próximo mês com o valor anterior, a menos que esse próximo mês ficasse após `goal_ends_on`
        ou esteja fechado.

        Quando `change_for_next_months` é `true`, o mês informado é atualizado e os meses **abertos**
        posteriores são removidos. Linhas de meses fechados posteriores nunca são destruídas.
      operationId: updateTagGoal
      security:
      - bearerAuth: []
      parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID da tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TagGoalRequest"
            examples:
              currentMonthOnly:
                summary: Alterar apenas o mês informado
                value:
                  tag_goal:
                    value: 600
                    starts_on: '2026-03-01'
              currentAndNextMonths:
                summary: Alterar o mês informado e todos os meses abertos seguintes
                value:
                  tag_goal:
                    value: 600
                    starts_on: '2026-03-01'
                    change_for_next_months: true
      responses:
        '200':
          description: Meta criada ou atualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TagSuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/categories":
    get:
      tags:
      - Categorias
      summary: Listar categorias
      description: Retorna uma lista paginada de categorias do usuário autenticado.
        Suporta filtros Ransack via `q`.
      operationId: listCategories
      security:
      - bearerAuth: []
      parameters:
      - name: q[name_cont]
        in: query
        required: false
        schema:
          type: string
        description: Filtrar categorias cujo nome contém o valor informado
      - name: q[active_eq]
        in: query
        required: false
        schema:
          type: boolean
        description: Filtrar por flag ativo
      - name: sort
        in: query
        required: false
        schema:
          type: string
          example: name asc
        description: Expressão de ordenação (padrão `active desc, name asc`)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Categorias listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CategoryCollection"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    post:
      tags:
      - Categorias
      summary: Criar categoria
      description: Cria uma nova categoria para o usuário autenticado. `goal_starts_on`
        e `goal_value` opcionais iniciam uma meta; `goal_ends_on` é opcional.
      operationId: createCategory
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryRequest"
            example:
              category:
                name: Vacation
                color: "#3B82F6"
                active: true
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CategorySuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/categories/{id}":
    get:
      tags:
      - Categorias
      summary: Exibir categoria
      description: Retorna uma única categoria pertencente ao usuário autenticado.
      operationId: showCategory
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CategorySuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    patch:
      tags:
      - Categorias
      summary: Atualizar categoria
      description: Atualiza uma categoria existente pertencente ao usuário autenticado.
        `goal_ends_on` encerra uma meta existente. `goal_starts_on` e `goal_value`
        iniciam uma meta apenas quando nenhuma existe.
      operationId: updateCategory
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryUpdateRequest"
            example:
              category:
                name: Vacation
                color: "#10B981"
                active: false
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CategorySuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    delete:
      tags:
      - Categorias
      summary: Excluir categoria
      description: |
        Exclui uma categoria pertencente ao usuário autenticado.
        Categorias já usadas por transações não podem ser excluídas; inative-as em vez disso.
      operationId: deleteCategory
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Categoria excluída
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/categories/{category_id}/goals":
    patch:
      tags:
      - Categorias
      summary: Atualizar ou dividir uma meta de categoria
      description: |
        Adiciona uma alteração de valor a uma meta de categoria pertencente ao usuário autenticado.

        As metas se aplicam desde o mês de `starts_on` até a próxima meta, e a resposta as lista ordenadas por ano e mês.
        Apenas o ano e o mês de `starts_on` são persistidos. Se já existir uma meta naquele year-month, ela é atualizada;
        caso contrário, uma nova meta é criada.
        É assim também que a primeira meta é iniciada quando a categoria não tem nenhuma.

        `starts_on` não pode ser após `goal_ends_on`. `value` deve ser diferente do valor já
        aplicado pela meta anterior. Meses passados e fechados são permitidos.

        Quando `change_for_next_months` é omitido ou `false`, apenas o mês informado é alterado.
        Se o próximo mês já tem uma meta, ela é mantida; caso contrário, uma meta é criada
        para o próximo mês com o valor anterior, a menos que esse próximo mês ficasse após `goal_ends_on`
        ou esteja fechado.

        Quando `change_for_next_months` é `true`, o mês informado é atualizado e os meses **abertos**
        posteriores são removidos. Linhas de meses fechados posteriores nunca são destruídas.
      operationId: updateCategoryGoal
      security:
      - bearerAuth: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID da categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryGoalRequest"
            examples:
              currentMonthOnly:
                summary: Alterar apenas o mês informado
                value:
                  category_goal:
                    value: 600
                    starts_on: '2026-03-01'
              currentAndNextMonths:
                summary: Alterar o mês informado e todos os meses abertos seguintes
                value:
                  category_goal:
                    value: 600
                    starts_on: '2026-03-01'
                    change_for_next_months: true
      responses:
