        first_recurrence_on:
          type: string
          format: date
          description: Menor `starts_on` entre todas as recorrências da transferência
        current_recurrence_on:
          type: string
          format: date
          description: |
            Primeiro dia de recorrência projetado no mês de abertura do período. Se essa data for anterior a
            `opening_date`, avança um mês. Se essa data for posterior a `closing_date` e o mês anterior
            for mais curto que o dia de fechamento do período, move para o dia seguinte ao último dia
            desse mês anterior. O dia é limitado ao último dia do mês quando necessário. Nunca
            precede `first_recurrence_on`. Itens recorrentes são omitidos quando essa data está fora do
            período.
        starts_on:
          type: string
          format: date
          description: "`starts_on` da recorrência atual"
        ends_on:
          type:
          - string
          - 'null'
          format: date
        canceled_on:
          type:
          - string
          - 'null'
          format: date
          description: Definido quando a transferência é cancelada. Null caso contrário.
    MonthlyStatementTransferResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: monthly_statement_transfer
        attributes:
          "$ref": "#/components/schemas/MonthlyStatementTransferAttributes"
    MonthlyStatementTransferCollection:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            "$ref": "#/components/schemas/MonthlyStatementTransferResource"
    GoalTransactionAttributes:
      type: object
      properties:
        id:
          type: string
