          description: Id da transação
        kind:
          type: string
          enum:
          - income
          - expense
          - transfer_between_accounts
        description:
          type: string
        recurrence_type:
          type: string
          enum:
          - one_time
          - installment
          - recurring
        value:
          type: string
          description: Valor decimal como string (precisão 15, escala 2) da recorrência
            atual
          example: '100.0'
        first_recurrence_on:
          type: string
          format: date
          description: Menor `starts_on` entre todas as recorrências da transação
        current_recurrence_on:
          type: string
          format: date
          description: Primeiro dia de recorrência projetado no período (ciclo da
            fatura para cartões, mês civil para contas e transferências)
        ends_on:
          type:
          - string
          - 'null'
          format: date
        category_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Id da categoria da transação
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Ids das tags da transação. Array vazio quando a transação não
            tem tags.
    GoalTransactionResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: goal_transaction
        attributes:
          "$ref": "#/components/schemas/GoalTransactionAttributes"
    GoalTransactionCollection:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            "$ref": "#/components/schemas/GoalTransactionResource"
    GoalTargetAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Id da categoria quando `kind` é `category`, id da tag quando
            `kind` é `tag`
        kind:
          type: string
          enum:
          - category
          - tag
        name:
          type: string
          description: Nome da categoria ou da tag
        color:
          type: string
          pattern: "^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$"
          description: Cor hexadecimal da categoria ou tag (`#RRGGBB` ou `#RRGGBBAA`)
          example: "#3B82F6"
        value:
          type: string
          description: Valor decimal da meta como string (precisão 15, escala 2) da
            meta mais recente em ou antes do mês solicitado
          example: '1000.0'
    GoalTargetResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: goal_target
        attributes:
          "$ref": "#/components/schemas/GoalTargetAttributes"
    GoalTargetCollection:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            "$ref": "#/components/schemas/GoalTargetResource"
    MonthlyStatusAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
          minimum: 1
          maximum: 9999
        status:
          type: string
          enum:
          - open
          - closed
        processing:
          type: boolean
        last_processed_at:
          type: string
          format: date-time
          nullable: true
    MonthlyStatusResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: monthly_status
        attributes:
          "$ref": "#/components/schemas/MonthlyStatusAttributes"
    MonthlyStatusSuccessResponse:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        message:
          type: string
        data:
          "$ref": "#/components/schemas/MonthlyStatusResource"
    MonthlyStatusUpdateRequest:
      type: object
      required:
      - monthly_status
      properties:
        monthly_status:
          type: object
          required:
          - month
          - year
          - status
          properties:
            month:
              type: integer
              minimum: 1
              maximum: 12
            year:
              type: integer
              minimum: 1
              maximum: 9999
            status:
              type: string
              enum:
              - open
              - closed
              description: Fecha ou reabre o mês
    SettlementProcessingRequest:
      type: object
      required:
      - settlement
      properties:
        settlement:
          type: object
          description: |
            O job espera `month`, `year` e `reference_date`. O HTTP não exige nem valida
            esses campos; valores ausentes ou inválidos falham de forma assíncrona e viram notificações.
          properties:
            month:
              type: integer
              minimum: 1
              maximum: 12
            year:
              type: integer
              minimum: 1
              maximum: 9999
            reference_date:
              type: string
              format: date
              description: |
                Data de corte inclusiva. O job exige hoje ou ontem para o mês atual.
                Ignorada para meses passados (o último dia do mês informado é usado em vez disso).
                Meses futuros são rejeitados pelo job, não pelo HTTP.
    NotificationAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: |
            Tipo de notificação gerado pelo sistema. Valores conhecidos:

            - `transaction.validation.errors` — uma transação ou transferência falhou durante a liquidação
            - `credit_card_invoice.validation.errors` — uma fatura de cartão de crédito falhou durante a liquidação
            - `settlement.errors` — o processo de liquidação falhou como um todo, ou ocorreu um erro inesperado
            - `monthly_status.closing.errors` — um mês não pôde ser fechado (itens pendentes ou falha no fechamento)
            - `monthly_status.errors` — erro inesperado no fechamento mensal
        title:
          type: string
        body:
          type:
          - string
          - 'null'
        read:
          type: boolean
        read_at:
          type:
          - string
          - 'null'
          format: date-time
        notifiable_type:
          type:
          - string
          - 'null'
          description: Tipo de referência fraca do recurso relacionado, quando houver
        notifiable_id:
          type:
          - string
          - 'null'
          format: uuid
        data:
          type: object
          additionalProperties: true
          description: |
            Payload específico do kind. A forma varia conforme `kind`:

            - `transaction.validation.errors`: `type`, `item_kind`, `month`, `year`, `occurred_on`
            - `credit_card_invoice.validation.errors`: `type`, `month`, `year`, `due_date`
            - `settlement.errors`: `type`, `month`, `year`, e `error` opcional (nome da classe da exceção)
            - `monthly_status.closing.errors`: `month`, `year`, `pending_occurrences`, `pending_invoices`, `failure`
            - `monthly_status.errors`: `type`, `error` opcional, e `month`/`year` opcionais quando a competência é conhecida
        created_at:
          type: string
          format: date-time
    NotificationResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: notification
        attributes:
          "$ref": "#/components/schemas/NotificationAttributes"
    NotificationCursorMeta:
      type: object
      properties:
        limit:
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor opaco para buscar a próxima página; null quando não
            há mais notificações
        has_more:
          type: boolean
        unread_count:
          type: integer
          description: Total de notificações não lidas do usuário autenticado
    NotificationCollection:
      type: object
      required:
      - status
      - type
      - data
      - meta
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            "$ref": "#/components/schemas/NotificationResource"
        meta:
          "$ref": "#/components/schemas/NotificationCursorMeta"
    NotificationSuccessResponse:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        message:
          type: string
        data:
          "$ref": "#/components/schemas/NotificationResource"
    NotificationReadAllResponse:
      type: object
      required:
      - status
      - message
      - meta
      properties:
        status:
          type: string
          const: success
        message:
          type: string
        meta:
          type: object
          properties:
            count:
              type: integer
              description: Número de notificações marcadas como lidas nesta requisição
    TransactionRecurrenceAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        starts_on:
          type: string
          format: date
        value:
          type: string
          description: Valor decimal como string (precisão 15, escala 2)
          example: '100.0'
    TransactionRecurrenceResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: transaction_recurrence
        attributes:
          "$ref": "#/components/schemas/TransactionRecurrenceAttributes"
    TransactionAttributes:
      type: object
      description: |
        Atributos comuns, recorrências e `current_value` estão presentes na listagem e no show.
        `account_id`, `credit_card_id`, `limit_consumption_type`, `source_account_id`, `destination_account_id` e `tag_ids` são preenchidos em show, create, update e cancel.
        Na listagem, `tag_ids` é sempre `null`. Alvos de pagamento que se aplicam ao item
        (`account_id` para métodos baseados em conta, `credit_card_id` e `limit_consumption_type` para cartão de crédito,
        `source_account_id` e `destination_account_id` para transferências) estão presentes como `null`.
        Campos que não se aplicam ao item são omitidos, não enviados como `null`.
        `account_id` só é incluído para métodos de pagamento baseados em conta.
        `credit_card_id` e `limit_consumption_type` só são incluídos quando `payment_method` é `credit_card`.
        `source_account_id` e `destination_account_id` só são incluídos quando `kind` é `transfer_between_accounts`.
        `starts_on` não é um atributo de nível superior; é retornado em cada item de `recurrences`.
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        kind:
          type: string
          enum:
          - income
          - expense
          - transfer_between_accounts
        status:
          type: string
          enum:
          - pending
          - active
          - completed
          - canceled
          description: Sempre `pending` na criação. Não gravável via atualização.
        payment_method:
          type: string
          nullable: true
          enum:
          - pix
          - debit
          - credit_card
          - ted
          - doc
          - deposit
          - cash
          - boleto
        recurrence_type:
          type: string
          enum:
          - one_time
          - installment
          - recurring
        installments_count:
          type: integer
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        canceled_on:
          type: string
          format: date
          nullable: true
          description: Definido com a data atual quando a transação é cancelada. Null
            caso contrário. Não gravável.
        account_id:
          type: string
          format: uuid
          nullable: true
          description: Presente apenas para métodos de pagamento baseados em conta.
            `null` na listagem; omitido caso contrário.
        credit_card_id:
          type: string
          format: uuid
          nullable: true
          description: Presente apenas quando `payment_method` é `credit_card`. `null`
            na listagem; omitido caso contrário.
        limit_consumption_type:
          type: string
          nullable: true
          enum:
          - upfront
          - monthly
          description: |
            Presente apenas quando `payment_method` é `credit_card`. `null` na listagem; omitido caso contrário.
            Sempre `upfront` para `one_time` e `monthly` para `recurring`.
            `installment` pode ser `upfront` ou `monthly`.
        source_account_id:
          type: string
          format: uuid
          nullable: true
          description: Presente apenas quando `kind` é `transfer_between_accounts`.
            `null` na listagem; omitido caso contrário.
        destination_account_id:
          type: string
          format: uuid
          nullable: true
          description: Presente apenas quando `kind` é `transfer_between_accounts`.
            `null` na listagem; omitido caso contrário.
        tag_ids:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: Sempre `null` na listagem. Preenchido em show, create, update
            e cancel.
        current_value:
          type: string
          nullable: true
          description: |
            Valor aplicável ao mês atual: a recorrência mais recente cujo year-month é em ou antes do mês atual.
            Se toda recorrência começa em um mês futuro, o valor da recorrência mais antiga é usado.
          example: '100.0'
        recurrences:
          type: array
          description: Histórico de valores ordenado por `starts_on`
          items:
            "$ref": "#/components/schemas/TransactionRecurrenceResource"
    TransactionResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: transaction
        attributes:
          "$ref": "#/components/schemas/TransactionAttributes"
    TransactionCollection:
      type: object
      required:
      - status
      - type
      - data
      - meta
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            "$ref": "#/components/schemas/TransactionResource"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    TransactionRequest:
      type: object
      required:
      - transaction
      properties:
        transaction:
          type: object
          description: |
            Categoria, tags, conta e cartão de crédito devem pertencer ao usuário autenticado e estar ativos.
            `starts_on` é somente escrita; a resposta o retorna em cada item de `recurrences`.
          required:
          - category_id
          - description
          - kind
          - recurrence_type
          - starts_on
          - value
          properties:
            category_id:
              type: string
              format: uuid
              description: Deve pertencer ao usuário autenticado e estar ativa
            description:
              type: string
            kind:
              type: string
              enum:
              - income
              - expense
              - transfer_between_accounts
            payment_method:
              type: string
              nullable: true
              enum:
              - pix
              - debit
              - credit_card
              - ted
              - doc
              - deposit
              - cash
              - boleto
              description: |
                Obrigatório para income/expense. Deve ser null para transfer_between_accounts.
                Income permite pix|ted|doc|deposit|cash|boleto.
                Expense permite pix|debit|credit_card|ted|doc|deposit|cash|boleto.
            recurrence_type:
              type: string
              enum:
              - one_time
              - installment
              - recurring
            starts_on:
              type: string
              format: date
              description: Primeira data de recorrência. Somente escrita; a resposta
                a expõe em `recurrences`.
            ends_on:
              type: string
              format: date
              nullable: true
              description: |
                Obrigatório para installment. Opcional para recurring. Deve ser null para one_time.
                Deve ser em ou após `starts_on`.
                Para installment, deve cair em um mês posterior a `starts_on` para que `installments_count` seja maior que 1.
            value:
              type: number
              minimum: 0
            limit_consumption_type:
              type: string
              nullable: true
              enum:
              - upfront
              - monthly
              description: |
                Usado quando payment_method é credit_card.
                Ignorado para one_time (sempre upfront) e recurring (sempre monthly).
                Obrigatório para installment, que pode escolher upfront ou monthly.
            account_id:
              type: string
              format: uuid
              description: |
                Obrigatório quando payment_method é baseado em conta (pix, debit, ted, doc, deposit, cash, boleto).
                Deve pertencer ao usuário autenticado e estar ativo.
            credit_card_id:
              type: string
              format: uuid
              description: Obrigatório quando payment_method é credit_card. Deve pertencer
                ao usuário autenticado e estar ativo.
            source_account_id:
              type: string
              format: uuid
              description: Obrigatório quando kind é transfer_between_accounts. Deve
                pertencer ao usuário autenticado e estar ativo.
            destination_account_id:
              type: string
              format: uuid
              description: |
                Obrigatório quando kind é transfer_between_accounts. Deve diferir de source_account_id.
                Deve pertencer ao usuário autenticado e estar ativo.
            tag_ids:
              type: array
              items:
                type: string
                format: uuid
              description: Cada tag deve pertencer ao usuário autenticado e estar
                ativa
    TransactionSuccessResponse:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        message:
          type: string
        data:
          "$ref": "#/components/schemas/TransactionResource"
    SettledTransactionAttributes:
      type: object
      description: |
        Uma ocorrência liquidada no mês solicitado.
        `id` é o id da liquidação. `transaction_id` é a transação pai.
        `value` é o valor liquidado, não o `current_value` da transação.
        `account_id` só é incluído para métodos de pagamento baseados em conta.
        `credit_card_id` e `limit_consumption_type` só são incluídos quando `payment_method` é `credit_card`.
        `source_account_id` e `destination_account_id` só são incluídos quando `kind` é `transfer_between_accounts`.
      properties:
        id:
          type: string
          format: uuid
          description: Id da liquidação
        transaction_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        kind:
          type: string
          enum:
          - income
          - expense
          - transfer_between_accounts
        status:
          type: string
          enum:
          - pending
          - active
          - completed
          - canceled
        payment_method:
          type: string
          nullable: true
          enum:
          - pix
          - debit
          - credit_card
          - ted
          - doc
          - deposit
          - cash
          - boleto
        recurrence_type:
          type: string
          enum:
          - one_time
          - installment
          - recurring
        installments_count:
          type: integer
          nullable: true
        ends_on:
          type:
          - string
          - 'null'
          format: date
        canceled_on:
          type:
          - string
          - 'null'
          format: date
        occurred_on:
          type: string
          format: date
          description: Data de negócio da ocorrência liquidada. Usada para selecionar
            o mês civil.
        settled_on:
          type: string
          format: date
          description: Data em que a ocorrência foi processada.
        value:
          type: string
          description: Valor decimal como string (precisão 15, escala 2) da liquidação
          example: '100.0'
        installment_number:
          type:
          - integer
          - 'null'
          description: Presente em ocorrências installment e recurring. Null para
            one-time.
        account_id:
          type: string
          format: uuid
          description: Presente apenas para métodos de pagamento baseados em conta.
        credit_card_id:
          type: string
          format: uuid
          description: Presente apenas quando `payment_method` é `credit_card`.
        limit_consumption_type:
          type: string
          enum:
          - upfront
          - monthly
          description: Presente apenas quando `payment_method` é `credit_card`.
        source_account_id:
          type: string
          format: uuid
          description: Presente apenas quando `kind` é `transfer_between_accounts`.
        destination_account_id:
          type: string
          format: uuid
          description: Presente apenas quando `kind` é `transfer_between_accounts`.
    SettledTransactionResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: settled_transaction
        attributes:
          "$ref": "#/components/schemas/SettledTransactionAttributes"
    SettledTransactionCollection:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: collection
        data:
          type: array
          items:
            "$ref": "#/components/schemas/SettledTransactionResource"
    TransactionUpdateRequest:
      type: object
      required:
      - transaction
      properties:
        transaction:
          type: object
          minProperties: 1
          properties:
            category_id:
              type: string
              format: uuid
            description:
              type: string
            kind:
              type: string
              enum:
              - income
              - expense
              - transfer_between_accounts
              description: Gravável apenas quando o status é pending
            payment_method:
              type: string
              nullable: true
              enum:
              - pix
              - debit
              - credit_card
              - ted
              - doc
              - deposit
              - cash
              - boleto
              description: Gravável apenas quando o status é pending
            recurrence_type:
              type: string
              enum:
              - one_time
              - installment
              - recurring
              description: Gravável apenas quando o status é pending
            ends_on:
              type: string
              format: date
              nullable: true
              description: |
                Gravável quando o status é pending, ou quando o status é active e recurrence_type é recurring.
                Limpo automaticamente quando recurrence_type é one_time.
                Deve ser em ou após `starts_on`.
                Para installment, deve cair em um mês posterior a `starts_on` para que `installments_count` seja maior que 1.
                Quando active, não pode ser anterior ao `starts_on` da recorrência existente mais recente.
            starts_on:
              type: string
              format: date
              description: |
                Gravável apenas quando o status é pending. Atualiza a recorrência existente no lugar.
                Somente escrita; a resposta o expõe em `recurrences`.
                Deve ser em ou antes de `ends_on` quando `ends_on` está presente.
            value:
              type: number
              minimum: 0
              description: Gravável apenas quando o status é pending. Atualiza a recorrência
                existente no lugar.
            limit_consumption_type:
              type: string
              nullable: true
              enum:
              - upfront
              - monthly
              description: |
                Gravável apenas quando o status é pending.
                Ignorado para one_time (sempre upfront) e recurring (sempre monthly).
                Obrigatório para installment, a menos que a transação já tenha um tipo de consumo de limite do cartão de crédito.
            account_id:
              type: string
              format: uuid
              description: Gravável quando o status é pending ou active
            credit_card_id:
              type: string
              format: uuid
              description: Gravável quando o status é pending ou active
            source_account_id:
              type: string
              format: uuid
              description: Gravável quando o status é pending ou active
            destination_account_id:
              type: string
              format: uuid
              description: Gravável quando o status é pending ou active
            tag_ids:
              type: array
              items:
                type: string
                format: uuid
          description: |
            Atualização parcial. Descrição, categoria e tags são sempre graváveis.
            Conta, cartão, origem, destino e ends_on recorrente são graváveis, a menos que o status seja completed ou canceled.
            Tipo, método de pagamento, tipo de recorrência, starts_on, value e consumo de limite são graváveis apenas quando pending.
            `installments_count` é calculado e não é um campo da requisição.
            Completed e canceled aceitam apenas description, category_id e tag_ids.
            Campos de pagamento mutuamente exclusivos são limpos para corresponder ao kind e ao método de pagamento resultantes.
            Uma categoria, conta, cartão ou tag inativa já vinculada pode ser mantida; uma recém-selecionada inativa é rejeitada.
    TransactionRecurrenceRequest:
      type: object
      required:
      - transaction_recurrence
      properties:
        transaction_recurrence:
          type: object
          required:
          - starts_on
          - value
          properties:
            starts_on:
              type: string
              format: date
              description: |
                Mês que deve receber o novo valor.
                Apenas o ano e o mês são obtidos desta data; o dia é substituído pelo dia da
                primeira recorrência da transação (limitado ao fim desse mês quando necessário).
                Se já existir uma recorrência no mesmo year-month, ela é atualizada no lugar.
                Caso contrário, uma nova recorrência é criada para a data normalizada.
                Não pode ser após o `ends_on` da transação.
                Rejeitado quando o mês está fechado, ou quando o mês está ausente e um mês posterior já está fechado.
                Meses passados são permitidos quando o status mensal deles ainda está aberto.
            value:
              type: number
              minimum: 0
              description: |
                Novo valor para o mês informado.
                Deve ser diferente do valor já aplicado pela recorrência anterior.
                Não pode ser alterado quando o `limit_consumption_type` da transação é `upfront`.
            change_for_next_months:
              type: boolean
              default: false
              description: |
                Quando `false` ou omitido, apenas o mês informado é alterado.
                Se o próximo mês já tem uma recorrência, ela é mantida; caso contrário, uma é criada
                com o valor anterior, a menos que esse próximo mês ficasse após `ends_on` ou esteja fechado.
                Recorrências posteriores permanecem inalteradas.
                Quando `true`, o novo valor se aplica a partir do mês informado e toda recorrência
                de mês aberto posterior é removida. Recorrências de meses fechados posteriores nunca são destruídas.
                Permitido apenas quando o `status` da transação é `active`.
    AuthenticationRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: A presença é obrigatória. O comprimento mínimo não é exigido
            no login.
        remember_me:
          type: boolean
          default: false
          description: |
            Quando `true`, o cookie de refresh é persistente e o refresh token no servidor dura 30 dias.
            Quando omitido ou `false`, o cookie é de sessão e o token no servidor dura 1 dia.
            O cookie é httpOnly, `SameSite=Lax` e `Secure` em produção.
    UserAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        configs:
          type: object
          additionalProperties: true
          description: 'Preferências do usuário armazenadas como JSON. Padrão: objeto
            vazio. Chave conhecida: `locale` (`en` ou `pt-BR`).'
    UserResource:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
              const: user
            attributes:
              "$ref": "#/components/schemas/UserAttributes"
    TokensData:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
          description: Token de sessão (Bearer). Expira em 15 minutos.
        user:
          "$ref": "#/components/schemas/UserResource"
    TokensSuccessResponse:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        data:
          "$ref": "#/components/schemas/TokensData"
    RefreshSessionRequest:
      type: object
      properties:
        remember_me:
          type: boolean
          default: false
          description: |
            Quando `true`, o cookie de refresh rotacionado é persistente e o token no servidor dura 30 dias.
            Quando omitido ou `false`, o cookie é de sessão e o token no servidor dura 1 dia.
            O `refresh_token` é lido do cookie httpOnly criptografado (`SameSite=Lax`; `Secure` em produção), não deste corpo.
    RegistrationRequest:
      type: object
      required:
      - first_name
      - last_name
      - email
      - password
      - password_confirmation
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    RegistrationSuccessResponse:
      type: object
      required:
      - status
      - type
      - data
      properties:
        status:
          type: string
          const: success
        type:
          type: string
          const: object
        data:
          type: object
          properties:
            user:
              "$ref": "#/components/schemas/UserResource"
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      properties:
        first_name:
          type: string
        last_name:
          type: string
        configs:
          type: object
          additionalProperties: true
          description: |
            Mesclado nas configs armazenadas. As chaves enviadas sobrescrevem as existentes; as chaves não enviadas são mantidas.
            Pode ser enviado sozinho, sem `first_name` ou `last_name`.
            Chave conhecida: `locale` (`en` ou `pt-BR`). Outras chaves são armazenadas como estão.
    AccountDeletionRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          format: password
    EmailConfirmationRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
    EmailChangeRequest:
      type: object
      required:
      - current_password
      - new_email
      properties:
        current_password:
          type: string
          format: password
        new_email:
          type: string
          format: email
    PasswordChangeRequest:
      type: object
      required:
      - current_password
      - password
      - password_confirmation
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    PasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    PasswordResetUpdateRequest:
      type: object
      required:
      - token
      - password
      - password_confirmation
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
