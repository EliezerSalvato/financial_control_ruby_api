        recurrence_type:
          type: string
          enum:
          - one_time
          - installment
          - recurring
        payment_method:
          type: string
          enum:
          - credit_card
          - account
          description: Agrupamento do extrato. `account` cobre todos os métodos de
            pagamento baseados em conta.
        resource_id:
          type: string
          format: uuid
          description: Id do cartão de crédito ou da conta
        resource_name:
          type: string
          description: Nome do cartão de crédito ou da conta
        resource_brand:
          type: string
          description: |
            Bandeira do cartão de crédito, ou `logo_key` da instituição para contas bancárias
            (usa a cor da conta quando a instituição não tem logo).
            Contas em dinheiro usam a cor da conta.
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: Presente para cartões de crédito. Sempre `null` para contas.
        value:
          type: string
          description: Valor decimal como string (precisão 15, escala 2) da recorrência
            atual
          example: '100.0'
        first_recurrence_on:
          type: string
          format: date
          description: Menor `starts_on` entre todas as recorrências da transação
        current_recurrence_on:
          type: string
          format: date
          description: |
            Primeiro dia de recorrência projetado no mês de abertura do período. Se essa data for anterior a
            `opening_date`, avança um mês. Se essa data for posterior a `closing_date` e o mês anterior
            for mais curto que o dia de fechamento do ciclo, move para o dia seguinte ao último dia
            desse mês anterior. O dia é limitado ao último dia do mês quando necessário. Nunca
            precede `first_recurrence_on`. Itens recorrentes são omitidos quando essa data está fora do
            período.
        starts_on:
          type: string
          format: date
          description: "`starts_on` da recorrência atual"
        ends_on:
          type:
          - string
          - 'null'
          format: date
        canceled_on:
          type:
          - string
          - 'null'
          format: date
          description: Definido quando a transação é cancelada. Null caso contrário.
    MonthlyStatementResource:
