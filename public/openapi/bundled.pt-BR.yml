  "/api/v1/monthly_statements":
    get:
      tags:
      - Extratos mensais
      summary: Listar itens do extrato mensal
      description: |
        Retorna as transações do usuário autenticado que pertencem ao mês civil informado.
        Itens de cartão de crédito usam o ciclo da fatura do cartão naquele mês (`opening_date`, `closing_date`, `due_date`).
        `opening_date` é o dia seguinte à data de fechamento do ciclo anterior (limitado quando o dia de fechamento
        não existe naquele mês). Itens de conta usam o primeiro e o último dia do mês e não têm `due_date`.
        `payment_method` é `credit_card` ou `account`. `value` e `starts_on` vêm da recorrência mais recente
        cujo `starts_on` é em ou antes da data de fechamento do período. `first_recurrence_on` é o menor
        `starts_on` entre todas as recorrências da transação. `current_recurrence_on` é esse primeiro
        dia de recorrência projetado no mês de abertura do período. Se essa data for anterior a `opening_date`,
        avança um mês. Se essa data for posterior a `closing_date` e o mês anterior for mais curto
        que o dia de fechamento do ciclo, move para o dia seguinte ao último dia desse mês anterior para que
        caia no ciclo atual. Nunca precede `first_recurrence_on`. Itens recurring e installment
        são incluídos quando `current_recurrence_on` cai no período e `ends_on` é null ou
        `current_recurrence_on` é em ou antes de `ends_on`. Se essa data foi deslocada para `opening_date`
        porque o dia projetado cai após `closing_date`, o item ainda é incluído quando
        `opening_date` é o dia seguinte a `ends_on`.
        Transferências entre contas não são incluídas.
        Transações pending, active e completed são incluídas. Transações canceladas antes de
        `current_recurrence_on` não são incluídas. Transações canceladas incluídas expõem `canceled_on`.
        `month`/`year` ausentes ou fora do intervalo retornam **422**.
      operationId: listMonthlyStatements
      security:
      - bearerAuth: []
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
        description: Mês civil do extrato (1-12)
      - name: year
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9999
        description: Ano civil do extrato
      responses:
        '200':
          description: Itens do extrato mensal listados
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MonthlyStatementCollection"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/monthly_statements/transfers":
    get:
      tags:
      - Extratos mensais
      summary: Listar transferências do extrato mensal
      description: |
        Retorna as transferências entre contas do usuário autenticado que pertencem ao mês civil informado.
        Os itens usam o primeiro e o último dia do mês como `opening_date` e `closing_date`.
        Cada item expõe as contas de origem e destino (`id`, `name` e `brand`).
        `brand` é o `logo_key` da instituição para contas bancárias (usa a cor da conta quando a
        instituição não tem logo). Contas em dinheiro usam a cor da conta.
        `value` e `starts_on` vêm da recorrência mais recente cujo `starts_on` é em ou antes da
        data de fechamento do período. `first_recurrence_on` é o menor `starts_on` entre todas as recorrências da
        transferência. `current_recurrence_on` é esse primeiro dia de recorrência projetado no mês de
        abertura do período. Se essa data for anterior a `opening_date`, avança um mês. Se essa data for
        posterior a `closing_date` e o mês anterior for mais curto que o dia de fechamento do período, move para
        o dia seguinte ao último dia desse mês anterior para que caia no período atual. Nunca
        precede `first_recurrence_on`. Itens recurring e installment são incluídos quando
        `current_recurrence_on` cai no período e `ends_on` é null ou `current_recurrence_on` é
        em ou antes de `ends_on`. Se essa data foi deslocada para `opening_date` porque o dia projetado
        cai após `closing_date`, o item ainda é incluído quando `opening_date` é o dia seguinte a
        `ends_on`.
        Receitas, despesas e transações de cartão de crédito não são incluídas.
        Transferências pending, active e completed são incluídas. Transferências canceladas antes de
        `current_recurrence_on` não são incluídas. Transferências canceladas incluídas expõem `canceled_on`.
        `month`/`year` ausentes ou fora do intervalo retornam **422**.
      operationId: listMonthlyStatementTransfers
      security:
      - bearerAuth: []
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
        description: Mês civil do extrato (1-12)
      - name: year
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9999
        description: Ano civil do extrato
      responses:
        '200':
          description: Transferências do extrato mensal listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MonthlyStatementTransferCollection"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/goals":
    get:
      tags:
      - Metas
      summary: Listar transações do painel de metas
      description: |
        Retorna as transações de receita, despesa e transferência entre contas
        do usuário autenticado para o mês civil informado. Itens de cartão de crédito usam o
        ciclo da fatura do cartão; itens de conta e transferências usam o mês civil. As regras do período são as mesmas
        de `GET /api/v1/monthly_statements` e `GET /api/v1/monthly_statements/transfers`.
        Cada item inclui `category_id` e `tag_ids`.
        Os valores das metas de categorias e tags vêm de `GET /api/v1/goals/targets`.
        `statuses` e `on` não são parâmetros de consulta públicos.
        `month`/`year` ausentes ou fora do intervalo retornam **422**.
      operationId: listGoals
      security:
      - bearerAuth: []
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
        description: Mês civil do painel (1-12)
      - name: year
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9999
        description: Ano civil do painel
      responses:
        '200':
          description: Transações do painel de metas listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GoalTransactionCollection"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/goals/targets":
    get:
      tags:
      - Metas
      summary: Listar metas de categoria e tag de um mês
      description: |
        Retorna as categorias e tags do usuário autenticado que têm uma meta aplicável ao
        mês civil informado. `value` vem da linha mais recente de `category_goals` / `tag_goals` cujo
        `(year, month)` é em ou antes do período solicitado — a mesma regra de “linha atual” usada para
        `transaction_recurrences` na lista de transações do painel.
        Categorias e tags cuja primeira meta começa após o mês solicitado são omitidas.
        Categorias e tags cujo `goal_ends_on` é anterior ao mês solicitado são omitidas.
        Cada item é identificado pelo id da categoria ou da tag (`kind` é `category` ou `tag`).
        `color` é a cor hexadecimal dessa categoria ou tag.
        `month`/`year` ausentes ou fora do intervalo retornam **422**.
      operationId: listGoalTargets
      security:
      - bearerAuth: []
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
        description: Mês civil do painel (1-12)
      - name: year
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9999
        description: Ano civil do painel
      responses:
        '200':
          description: Metas de categoria e tag listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GoalTargetCollection"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/monthly_statuses":
    get:
      tags:
      - Status mensais
      summary: Exibir status mensal
      description: |
        Retorna o status mensal do usuário autenticado para o mês civil informado.
        A identidade é `(user, month, year)`, não um UUID. `user` é sempre o usuário atual.
        Se nenhuma linha existir, a API retorna 404 sem criar um registro.
        `month`/`year` ausentes ou fora do intervalo retornam **422**.

        Atualizações de processamento (`processing` e `last_processed_at`) também são enviadas via Action Cable
        em `MonthlyStatusChannel`. Veja a seção WebSockets na descrição da API.
      operationId: showMonthlyStatus
      security:
      - bearerAuth: []
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
        description: Mês civil (1-12)
      - name: year
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9999
        description: Ano civil
      responses:
        '200':
          description: Status mensal encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MonthlyStatusSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    patch:
      tags:
      - Status mensais
      summary: Atualizar status mensal
      description: |
        Fecha ou reabre o mês do usuário autenticado. A identidade é `(user, month, year)`,
        não um UUID. `user` é sempre o usuário atual.
        Se nenhuma linha existir, uma é criada e depois atualizada, então um mês ausente pode ser fechado
        em uma única requisição. Um mês ausente que precede um mês já fechado é rejeitado
        com 422 (`later_month_closed` em `base`) e não é criado.
        Enviar o `status` já persistido é idempotente (200).
      operationId: updateMonthlyStatus
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MonthlyStatusUpdateRequest"
            example:
              monthly_status:
                month: 8
                year: 2026
                status: closed
      responses:
        '200':
          description: Status mensal atualizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MonthlyStatusSuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/settlements/processing":
    post:
      tags:
      - Liquidações
      summary: Enfileirar processamento de liquidação
      description: |
        Aceita uma requisição de liquidação e retorna **202** imediatamente. O HTTP não valida `month`,
        `year` ou `reference_date` além de exigir o wrapper `settlement` (wrapper ausente → 400).

        Um job em background é enfileirado, a menos que aquele mês civil já esteja em `processing`. Nesse caso
        a resposta ainda é 202 com a mesma mensagem de enfileiramento, e nenhum job novo é enfileirado.

        O job processa ocorrências vencidas, transferências e faturas de cartão de crédito do usuário
        autenticado no mês civil informado.

        Para o mês atual, `reference_date` deve ser hoje ou ontem. Para um mês passado, `reference_date`
        é ignorado e o último dia daquele mês é usado. Meses futuros são rejeitados pelo job.

        O job também rejeita um mês quando o mês civil anterior ainda tem um `monthly_status` aberto.
        Se aquele mês anterior não tem linha aberta (ausente ou já fechado), o processamento pode começar.

        Um mês que precede um `monthly_status` fechado também é rejeitado. Meses abertos ou ausentes posteriores
        não bloqueiam o processamento.

        Essas regras de domínio e falhas de itens (saldo ou limite insuficiente) rodam de forma assíncrona.
        Elas viram notificações; não aparecem nesta resposta HTTP.
      operationId: processSettlements
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SettlementProcessingRequest"
            example:
              settlement:
                month: 8
                year: 2026
                reference_date: '2026-08-28'
      responses:
        '202':
          description: |
            Aceito. Um job é enfileirado, a menos que o mês já esteja em processamento.
            A mensagem é a mesma nos dois casos.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
              example:
                status: success
                message: Settlement processing has been queued
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/notifications":
    get:
      tags:
      - Notificações
      summary: Listar notificações
      description: |
        Retorna as notificações do usuário autenticado em ordem de scroll infinito (`id` descendente, UUID v7).
        A paginação é baseada em keyset: passe `meta.next_cursor` da resposta anterior como `after`.
        A contagem de não lidas é exposta em `meta.unread_count`. Passe `unread=true` para retornar apenas notificações não lidas.
        Não há parâmetro `sort`.
      operationId: listNotifications
      security:
      - bearerAuth: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Cursor opaco de `meta.next_cursor`. Omita para buscar a página
          mais recente.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Quando true, retorna apenas notificações não lidas. `meta.unread_count`
          permanece a contagem total de não lidas.
      responses:
        '200':
          description: Notificações listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationCollection"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/notifications/{id}":
    get:
      tags:
      - Notificações
      summary: Exibir notificação
      description: Retorna uma única notificação pertencente ao usuário autenticado.
      operationId: showNotification
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Notificação encontrada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/notifications/{id}/read":
    post:
      tags:
      - Notificações
      summary: Marcar notificação como lida
      description: |
        Marca como lida uma notificação pertencente ao usuário autenticado.
        Notificações já lidas têm sucesso sem alterar o `read_at` original.
      operationId: readNotification
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Notificação marcada como lida
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/notifications/read_all":
    post:
      tags:
      - Notificações
      summary: Marcar todas as notificações como lidas
      description: |
        Marca como lidas todas as notificações não lidas do usuário autenticado.
        Tem sucesso com `meta.count` mesmo quando não há notificações não lidas.
      operationId: readAllNotifications
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Notificações marcadas como lidas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationReadAllResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/transactions":
    get:
      tags:
      - Transações
      summary: Listar transações
      description: |
        Retorna uma lista paginada de transações do usuário autenticado. Suporta filtros Ransack via `q`.
        Os itens da listagem incluem recorrências e `current_value`.
        Alvos de pagamento que se aplicam ao item estão presentes como `null`; alvos que não se aplicam são omitidos.
        `tag_ids` é sempre `null` na listagem. Use show para ler alvos de pagamento e tags preenchidos.
      operationId: listTransactions
      security:
      - bearerAuth: []
      parameters:
      - name: q[id_eq]
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filtrar por id da transação
      - name: q[description_cont]
        in: query
        required: false
        schema:
          type: string
        description: Filtrar transações cuja descrição contém o valor informado
      - name: q[kind_eq]
        in: query
        required: false
        schema:
          type: string
          enum:
          - income
          - expense
          - transfer_between_accounts
        description: Filtrar por tipo
      - name: q[status_eq]
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - active
          - completed
          - canceled
        description: Filtrar por status
      - name: q[payment_method_eq]
        in: query
        required: false
        schema:
          type: string
          enum:
          - pix
          - debit
          - credit_card
          - ted
          - doc
          - deposit
          - cash
          - boleto
        description: Filtrar por método de pagamento
      - name: q[recurrence_type_eq]
        in: query
        required: false
        schema:
          type: string
          enum:
          - one_time
          - installment
          - recurring
        description: Filtrar por tipo de recorrência
      - name: q[category_id_eq]
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filtrar por id da categoria
      - name: q[installments_count_eq]
        in: query
        required: false
        schema:
          type: integer
        description: Filtrar por quantidade de parcelas
      - name: q[created_at_gteq]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filtrar transações criadas em ou após o datetime informado
      - name: q[created_at_lteq]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filtrar transações criadas em ou antes do datetime informado
      - name: q[ends_on_gteq]
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filtrar transações cujo ends_on é em ou após a data informada
      - name: q[ends_on_lteq]
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filtrar transações cujo ends_on é em ou antes da data informada
      - name: sort
        in: query
        required: false
        schema:
          type: string
          example: status, created_at desc
        description: Expressão de ordenação (padrão `status, created_at desc`)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Transações listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionCollection"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    post:
      tags:
      - Transações
      summary: Criar transação
      description: |
        Cria uma nova transação para o usuário autenticado.
        `installments_count` é calculado a partir de `recurrence_type`, `starts_on` e `ends_on`.
        `status` é sempre definido como `pending` e não pode ser enviado.
        `starts_on` é somente escrita na requisição; a resposta o expõe em cada item de `recurrences`.
        Categoria, tags, conta e cartão de crédito devem pertencer ao usuário autenticado e estar ativos.
        Uma data que pertence a um mês fechado é rejeitada com 422 (`monthly_status_closed` em `base`).
        Uma data em um mês ausente que precede um mês já fechado é rejeitada com 422 (`later_month_closed` em `base`).
        Transações de cartão de crédito usam o mês do ciclo da fatura do cartão, não o mês civil de `starts_on`.
        Uma despesa de cartão de crédito cujas datas se sobrepõem a uma fatura paga é rejeitada com 422 (`invoice_already_paid` em `base`).
      operationId: createTransaction
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionRequest"
            example:
              transaction:
                description: Compras do mercado
                kind: expense
                payment_method: pix
                recurrence_type: one_time
                starts_on: '2026-08-11'
                value: 100
                account_id: '018f1a2b-3c4d-7e8f-9a0b-1c2d3e4f5a6b'
                category_id: '018f1a2b-3c4d-7e8f-9a0b-1c2d3e4f5a6c'
                tag_ids:
                - '018f1a2b-3c4d-7e8f-9a0b-1c2d3e4f5a6d'
      responses:
        '201':
          description: Transação criada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionSuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/transactions/settled":
    get:
      tags:
      - Transações
      summary: Listar transações liquidadas
      description: |
        Retorna as ocorrências de transação do usuário autenticado que foram liquidadas no mês civil informado.
        Um item é incluído quando tem uma liquidação cuja `occurred_on` cai nesse mês.
        Transações pending sem liquidação não são incluídas.
        Transações recurring e installment aparecem uma vez por ocorrência liquidada no mês.
        Cada item expõe o valor e as datas da liquidação (`occurred_on`, `settled_on`, `value`, `installment_number`)
        junto com a identidade da transação e o alvo de pagamento.
        Receitas, despesas e transferências entre contas são incluídas.
        O `type` opcional restringe a lista a um alvo de pagamento (`account`, `credit_card` ou `transfer_between_accounts`).
        `month`/`year` ausentes ou fora do intervalo retornam **422**.
      operationId: listSettledTransactions
      security:
      - bearerAuth: []
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
        description: Mês civil da ocorrência de liquidação (1-12)
      - name: year
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9999
        description: Ano civil da ocorrência de liquidação
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - account
          - credit_card
          - transfer_between_accounts
        description: 'Filtrar por alvo de pagamento. Quando omitido, liquidações de
          conta, cartão de crédito e transferência são todas incluídas.

          '
      responses:
        '200':
          description: Transações liquidadas listadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettledTransactionCollection"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/transactions/{id}":
    get:
      tags:
      - Transações
      summary: Exibir transação
      description: Retorna uma única transação pertencente ao usuário autenticado,
        incluindo alvos de pagamento, tags e recorrências.
      operationId: showTransaction
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Transação encontrada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    patch:
      tags:
      - Transações
      summary: Atualizar transação
      description: |
        Atualiza uma transação existente pertencente ao usuário autenticado.
        Os campos editáveis dependem de `status` (veja `TransactionUpdateRequest`).
        Quando pending, `starts_on` e `value` atualizam a recorrência existente no lugar.
        `starts_on` é somente escrita na requisição; a resposta o expõe em cada item de `recurrences`.
        `status` não pode ser alterado.
        Mover uma despesa de cartão de crédito para uma fatura paga (via `starts_on`, `ends_on`, `credit_card_id`, `payment_method` ou `recurrence_type`) é rejeitado com 422 (`invoice_already_paid` em `base`).
      operationId: updateTransaction
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionUpdateRequest"
            example:
              transaction:
                description: Compras do mercado (atualizado)
                value: 120
                starts_on: '2026-10-11'
      responses:
        '200':
          description: Transação atualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionSuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    delete:
      tags:
      - Transações
      summary: Excluir transação
      description: |
        Exclui uma transação pending pertencente ao usuário autenticado, incluindo dependentes.
        Transações active, completed e canceled são rejeitadas.
        Para cancelar uma transação active, use `POST /api/v1/transactions/{id}/cancel`.
      operationId: deleteTransaction
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Transação excluída
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/transactions/{id}/cancel":
    post:
      tags:
      - Transações
      summary: Cancelar transação
      description: |
        Cancela uma transação active pertencente ao usuário autenticado definindo `status` como `canceled`
        e `canceled_on` com a data atual.
        Transações pending, completed e já canceled são rejeitadas.
        Para excluir uma transação pending, use `DELETE /api/v1/transactions/{id}`.
      operationId: cancelTransaction
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Transação cancelada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/transactions/{transaction_id}/recurrences":
    post:
      tags:
      - Transações
      summary: Criar ou dividir uma recorrência de transação
      description: |
        Adiciona uma alteração de valor a uma transação recurring ou installment pertencente ao usuário autenticado.

        As recorrências se aplicam desde `starts_on` até a próxima recorrência, e a resposta as lista ordenadas por `starts_on`.
        Apenas o ano e o mês são obtidos de `starts_on`; o dia é substituído pelo dia da
        primeira recorrência da transação (limitado ao fim desse mês quando necessário).
        Se já existir uma recorrência no mesmo year-month de `starts_on`, ela é atualizada no lugar;
        caso contrário, uma nova recorrência é criada.

        Permitido apenas quando `status` é `active`. `starts_on` não pode ser após o `ends_on` da transação.
        Uma data que pertence a um mês fechado é rejeitada com 422 (`monthly_status_closed` em `starts_on`).
        Uma data em um mês ausente que precede um mês já fechado é rejeitada com 422 (`later_month_closed` em `starts_on`).
        Meses passados são permitidos quando o status mensal deles ainda está aberto.
        Criar uma recorrência em um mês que ainda não tem uma exige `value` diferente do
        valor já aplicado por uma recorrência anterior. Atualizar a recorrência do mês que
        já carrega esse valor é permitido mesmo quando `value` não muda.
        Transações pending, completed e canceled são rejeitadas. Transações one-time são rejeitadas.
        Parcelas de cartão de crédito com `limit_consumption_type` `upfront` não podem alterar valores de recorrência.

        Quando `change_for_next_months` é omitido ou `false`, apenas o mês informado é alterado.
        Se o próximo mês já tem uma recorrência, ela é mantida; caso contrário, uma recorrência é criada
        para o próximo mês com o valor anterior, a menos que esse próximo mês ficasse após `ends_on`
        ou esteja fechado.
        Todas as outras recorrências permanecem inalteradas.

        Quando `change_for_next_months` é `true`, o mês informado é atualizado (ou mantido quando `value` corresponde
        ao valor já aplicado) e toda recorrência de mês aberto posterior é removida para que esse valor
        se aplique a partir daquele mês. Recorrências de meses fechados posteriores nunca são destruídas.
      operationId: createTransactionRecurrence
      security:
      - bearerAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID da transação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionRecurrenceRequest"
            examples:
              currentMonthOnly:
                summary: Alterar apenas o mês informado
                value:
                  transaction_recurrence:
                    value: 120
                    starts_on: '2026-01-01'
              currentAndNextMonths:
                summary: Alterar o mês informado e todos os meses seguintes
                value:
                  transaction_recurrence:
                    value: 120
                    starts_on: '2026-01-01'
                    change_for_next_months: true
      responses:
        '200':
          description: Recorrência criada ou atualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionSuccessResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/authentications":
    post:
      tags:
      - Autenticação
      summary: Entrar
      description: |
        Autentica com e-mail e senha.
        O usuário deve estar **verificado** e **ativo**.
        Retorna um `token` de sessão de curta duração no corpo JSON e define um cookie
        httpOnly criptografado `refresh_token` (`SameSite=Lax`; `Secure` em produção). O refresh token nunca
        é retornado no corpo JSON. O `remember_me` opcional controla a duração do cookie e do refresh.
        Quando um cookie `locale` válido está presente e difere de `configs.locale`, o locale do usuário
        é atualizado para corresponder ao cookie. Outras chaves de config são mantidas.
        O login **revoga todas as sessões de refresh anteriores** desse usuário, então apenas o novo cookie
        de refresh é válido. Um token Bearer mais antigo permanece válido até expirar (15 minutos).
      operationId: createAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthenticationRequest"
            examples:
              default:
                summary: Cookie de sessão (1 dia no servidor)
                value:
                  email: john.doe@example.com
                  password: password123
              rememberMe:
                summary: Cookie de refresh persistente (30 dias)
                value:
                  email: john.doe@example.com
                  password: password123
                  remember_me: true
      responses:
        '200':
          description: Autenticado. Define o cookie httpOnly criptografado `refresh_token`.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Cookie httpOnly criptografado `refresh_token` (`SameSite=Lax`; `Secure` em produção).
                Cookie de sessão por padrão. Persistente (30 dias) quando `remember_me` é true.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokensSuccessResponse"
              example:
                status: success
                type: object
                data:
                  token: eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaEpJaWs9IiwiZXhwIjpudWxsLCJwdXIiOiJzZXNzaW9uX3Rva2VuIn19--abc
                  user:
                    data:
                      id: '019abc...'
                      type: user
                      attributes:
                        id: '019abc...'
                        first_name: John
                        last_name: Doe
                        email: john.doe@example.com
                        configs: {}
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/session/refreshes":
    patch:
      tags:
      - Autenticação
      summary: Atualizar sessão
      description: |
        Lê o cookie httpOnly criptografado `refresh_token` e retorna um novo `token` de sessão.
        Rotaciona o cookie de refresh. Não exige o header Bearer.
        O `remember_me` opcional no corpo controla a duração do cookie rotacionado.
      operationId: refreshSession
      parameters:
      - name: refresh_token
        in: cookie
        required: true
        schema:
          type: string
        description: Cookie httpOnly criptografado do refresh token definido no login
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshSessionRequest"
            example:
              remember_me: true
      responses:
        '200':
          description: Token de sessão rotacionado. Define um novo cookie httpOnly
            criptografado `refresh_token`.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Cookie httpOnly criptografado `refresh_token` rotacionado (`SameSite=Lax`; `Secure` em produção).
                Cookie de sessão por padrão. Persistente (30 dias) quando `remember_me` é true.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokensSuccessResponse"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/session/revokes":
    delete:
      tags:
      - Autenticação
      summary: Revogar todas as sessões
      description: |
        Invalida todas as sessões de refresh ativas do usuário autenticado.
        O token Bearer atual permanece válido até expirar (15 minutos).
        O cookie `refresh_token` não é excluído; a próxima tentativa de refresh falha até o usuário entrar novamente.
      operationId: revokeSessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sessões revogadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/registrations":
    post:
      tags:
      - Usuário
      summary: Registrar um novo usuário
      description: |
        Cria um usuário (não verificado) e enfileira uma mensagem de confirmação de e-mail.
        Após o registro, confirme o e-mail antes de entrar.
      operationId: createRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegistrationRequest"
            example:
              first_name: John
              last_name: Doe
              email: john.doe@example.com
              password: password123
              password_confirmation: password123
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegistrationSuccessResponse"
              example:
                status: success
                type: object
                data:
                  user:
                    data:
                      id: '019abc...'
                      type: user
                      attributes:
                        id: '019abc...'
                        first_name: John
                        last_name: Doe
                        email: john.doe@example.com
                        configs: {}
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/profiles":
    patch:
      tags:
      - Usuário
      summary: Atualizar perfil
      description: |
        Atualiza parcialmente o perfil do usuário autenticado. Envie qualquer combinação de `first_name`, `last_name` e `configs`.
        `configs` é mesclado no JSON armazenado: as chaves enviadas sobrescrevem as existentes, e as demais são mantidas.
      operationId: updateProfile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileUpdateRequest"
            examples:
              names:
                summary: Atualizar nomes
                value:
                  first_name: Jane
                  last_name: Smith
              configs:
                summary: Mesclar configs sem alterar nomes
                value:
                  configs:
                    locale: pt-BR
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/accounts":
    delete:
      tags:
      - Usuário
      summary: Excluir conta
      description: Exclui permanentemente o usuário autenticado. Exige a senha atual.
      operationId: deleteUserAccount
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountDeletionRequest"
            example:
              password: password123
      responses:
        '200':
          description: Conta excluída
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/email/confirmations":
    post:
      tags:
      - Usuário
      summary: Confirmar e-mail
      description: Confirma o e-mail do usuário com o token recebido por e-mail. Endpoint
        público.
      operationId: confirmEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmailConfirmationRequest"
            example:
              token: confirmation-token-from-email
      responses:
        '200':
          description: E-mail confirmado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/email/changes":
    patch:
      tags:
      - Usuário
      summary: Alterar e-mail
      description: |
        Altera o e-mail do usuário autenticado.
        Exige a senha atual. Marca o usuário como não verificado e envia um novo e-mail de confirmação.
        Revoga todas as sessões de refresh. O token Bearer atual permanece válido até expirar
        (o usuário permanece autenticado nesta requisição). O cookie `refresh_token` não é excluído.
        Entrar com o novo e-mail fica bloqueado até o usuário confirmá-lo.
      operationId: changeEmail
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmailChangeRequest"
            example:
              current_password: password123
              new_email: new.email@example.com
      responses:
        '200':
          description: Alteração de e-mail iniciada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/password/changes":
    patch:
      tags:
      - Usuário
      summary: Alterar senha
      description: |
        Altera a senha do usuário autenticado. Exige a senha atual.
        Revoga todas as sessões de refresh. O token Bearer atual permanece válido até expirar.
        O cookie `refresh_token` não é excluído.
      operationId: changePassword
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordChangeRequest"
            example:
              current_password: password123
              password: new-password123
              password_confirmation: new-password123
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/user/password/resets":
    post:
      tags:
      - Usuário
      summary: Solicitar redefinição de senha
      description: |
        Envia instruções de redefinição de senha para o e-mail informado.
        O usuário deve existir, estar **ativo** e ter e-mail verificado. Endpoint público.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetRequest"
            example:
              email: john.doe@example.com
      responses:
        '200':
          description: Instruções de redefinição enviadas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
    patch:
      tags:
      - Usuário
      summary: Redefinir senha
      description: |
        Define uma nova senha usando o token do e-mail de redefinição. Endpoint público.
        Revoga todas as sessões de refresh. Qualquer token Bearer já emitido permanece válido até expirar.
        O cookie `refresh_token` não é excluído.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetUpdateRequest"
            example:
              token: reset-token-from-email
              password: new-password123
              password_confirmation: new-password123
      responses:
        '200':
          description: Redefinição de senha
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageSuccessResponse"
        '422':
          "$ref": "#/components/responses/UnprocessableContent"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed session token
      description: |
        Token de sessão retornado no corpo JSON por `POST /api/v1/user/authentications`
        ou `PATCH /api/v1/user/session/refreshes`. O refresh token é um cookie
        httpOnly criptografado (`SameSite=Lax`; `Secure` em produção), não um header Bearer.

        ```http
        Authorization: Bearer <token>
        ```
  responses:
    BadRequest:
      description: Parâmetros ou filtros de requisição inválidos
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Invalid request
            details: {}
    Unauthorized:
      description: Token Bearer ausente ou inválido, ou token válido de um usuário
        inativo
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Unauthorized
            details: {}
    UnprocessableContent:
      description: Falha de validação ou de regra de negócio
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Email has already been taken
            details:
              email:
              - has already been taken
    TooManyRequests:
      description: |
        Limite de taxa excedido. O corpo é o `text/plain` padrão do Rack::Attack (`Retry later`),
        não o envelope JSON de erro. Veja a seção Rate limiting na descrição da API.
      content:
        text/plain:
          schema:
            type: string
            example: 'Retry later

              '
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Not found
            details: {}
    InternalServerError:
      description: |
        Falha inesperada. Usa o envelope JSON de erro.
        Em produção a mensagem é uma string genérica de internal-server-error;
        fora de produção é a mensagem da exceção.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Internal Server Error
            details: {}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso
  schemas:
    TagGoalAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
        value:
          type: string
          description: Valor decimal como string (precisão 15, escala 2)
          example: '500.0'
    TagGoalResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: tag_goal
        attributes:
          "$ref": "#/components/schemas/TagGoalAttributes"
    TagAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: "^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$"
          description: Cor hexadecimal (`#RRGGBB` ou `#RRGGBBAA`)
          example: "#3B82F6"
        active:
          type: boolean
        goal_ends_on:
          type:
          - string
          - 'null'
          format: date
          description: Mês final opcional da meta, sempre armazenado como o primeiro
            dia desse mês. Null significa que a meta continua. Grave isso na criação/atualização
            da tag; o histórico de valores está em `goals`.
        current_goal:
          oneOf:
          - "$ref": "#/components/schemas/TagGoalResource"
          - type: 'null'
          description: Meta aplicável ao mês atual, ou null quando não há meta ou
            o mês atual é posterior a `goal_ends_on`.
        goals:
          type: array
          description: Histórico de valores da meta ordenado por `year` e `month`
          items:
            "$ref": "#/components/schemas/TagGoalResource"
    TagResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
