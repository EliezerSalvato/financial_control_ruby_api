delete:
  tags: [Authentication]
  summary: Revoke all sessions
  description: |
    Invalidates all active refresh sessions for the authenticated user.
    The current Bearer token remains valid until it expires (15 minutes).
    The `refresh_token` cookie is not deleted; the next refresh attempt fails until the user signs in again.
  operationId: revokeSessions
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Sessions revoked
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
    "429":
      $ref: "../../components/responses.yml#/TooManyRequests"
