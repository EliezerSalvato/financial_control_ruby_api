post:
  tags: [Authentication]
  summary: Sign in
  description: |
    Authenticates with email and password.
    The user must be **verified** and **active**.
    Returns a short-lived session `token` and a long-lived `refresh_token`.
  operationId: createAuthentication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/AuthenticationRequest"
        example:
          email: john.doe@example.com
          password: password123
  responses:
    "200":
      description: Authenticated
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
          example:
            status: success
            type: object
            data:
              token: eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaEpJaWs9IiwiZXhwIjpudWxsLCJwdXIiOiJzZXNzaW9uX3Rva2VuIn19--abc
              refresh_token: a1b2c3d4e5f6...
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
