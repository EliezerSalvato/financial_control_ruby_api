get:
  tags: [Goals]
  summary: List goal dashboard transactions
  description: |
    Returns the authenticated user's income, expense, and transfer-between-accounts
    transactions for the given calendar month. Credit card items use the card billing
    cycle; account items and transfers use the civil month. Period rules are the same
    as `GET /api/v1/monthly_statements` and `GET /api/v1/monthly_statements/transfers`.
    Each item includes `category_id` and `tag_ids`.
    Goal amounts for categories and tags come from `GET /api/v1/goals/targets`.
    `statuses` and `on` are not public query params.
    Missing or out-of-range `month`/`year` return **422**.
  operationId: listGoals
  security:
    - bearerAuth: []
  parameters:
    - name: month
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Calendar month of the dashboard (1-12)
    - name: year
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 9999
      description: Calendar year of the dashboard
  responses:
    "200":
      description: Goal dashboard transactions listed
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yml#/GoalTransactionCollection"
    "401":
      $ref: "../components/responses.yml#/Unauthorized"
    "422":
      $ref: "../components/responses.yml#/UnprocessableContent"
    "429":
      $ref: "../components/responses.yml#/TooManyRequests"
