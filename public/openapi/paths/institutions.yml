get:
  tags: [Institutions]
  summary: List institutions
  description: Returns a paginated list of institutions for the authenticated user. Supports Ransack filters via `q`.
  operationId: listInstitutions
  security:
    - bearerAuth: []
  parameters:
    - name: q[name_cont]
      in: query
      required: false
      schema:
        type: string
      description: Filter institutions whose name contains the given value
    - name: q[active_eq]
      in: query
      required: false
      schema:
        type: boolean
      description: Filter by active flag
    - name: sort
      in: query
      required: false
      schema:
        type: string
        example: name asc
      description: Sort expression (default `active desc, name asc`)
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  responses:
    "200":
      description: Institutions listed
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yml#/InstitutionCollection"
    "400":
      $ref: "../components/responses.yml#/BadRequest"
    "401":
      $ref: "../components/responses.yml#/Unauthorized"
    "422":
      $ref: "../components/responses.yml#/UnprocessableContent"
    "429":
      $ref: "../components/responses.yml#/TooManyRequests"

post:
  tags: [Institutions]
  summary: Create institution
  description: Creates a new institution for the authenticated user. `name` and `logo_key` are required.
  operationId: createInstitution
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yml#/InstitutionRequest"
        example:
          institution:
            name: Nubank
            logo_key: institutions/nubank.png
            active: true
  responses:
    "201":
      description: Institution created
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yml#/InstitutionSuccessResponse"
    "400":
      $ref: "../components/responses.yml#/BadRequest"
    "401":
      $ref: "../components/responses.yml#/Unauthorized"
    "422":
      $ref: "../components/responses.yml#/UnprocessableContent"
    "429":
      $ref: "../components/responses.yml#/TooManyRequests"
