post:
  tags: [Notifications]
  summary: Mark all notifications as read
  description: |
    Marks all unread notifications of the authenticated user as read.
    Succeeds with `meta.count` even when there are no unread notifications.
  operationId: readAllNotifications
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Notifications marked as read
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yml#/NotificationReadAllResponse"
    "401":
      $ref: "../components/responses.yml#/Unauthorized"
    "422":
      $ref: "../components/responses.yml#/UnprocessableContent"
