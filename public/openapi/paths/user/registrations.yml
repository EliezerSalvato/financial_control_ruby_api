post:
  tags: [User]
  summary: Register a new user
  description: |
    Creates a user (unverified) and enqueues an email confirmation message.
    After registration, confirm the email before signing in.
  operationId: createRegistration
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/RegistrationRequest"
        example:
          first_name: John
          last_name: Doe
          email: john.doe@example.com
          password: password123
          password_confirmation: password123
  responses:
    "201":
      description: User created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/RegistrationSuccessResponse"
          example:
            status: success
            type: object
            data:
              user:
                data:
                  id: "019abc..."
                  type: user
                  attributes:
                    id: "019abc..."
                    first_name: John
                    last_name: Doe
                    email: john.doe@example.com
                    configs: {}
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
