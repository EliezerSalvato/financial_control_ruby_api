patch:
  tags: [User]
  summary: Change password
  description: |
    Changes the password of the authenticated user. Requires the current password.
    Revokes all refresh sessions. The current Bearer token remains valid until it expires.
    The `refresh_token` cookie is not deleted.
  operationId: changePassword
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/PasswordChangeRequest"
        example:
          current_password: password123
          password: new-password123
          password_confirmation: new-password123
  responses:
    "200":
      description: Password changed
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
    "429":
      $ref: "../../components/responses.yml#/TooManyRequests"
