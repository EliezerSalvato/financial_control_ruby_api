post:
  tags: [User]
  summary: Request password reset
  description: |
    Sends password reset instructions to the given email.
    The user must exist and have a verified email. Public endpoint.
  operationId: requestPasswordReset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/PasswordResetRequest"
        example:
          email: john.doe@example.com
  responses:
    "200":
      description: Reset instructions sent
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"

patch:
  tags: [User]
  summary: Reset password
  description: Sets a new password using the token from the reset email. Public endpoint.
  operationId: resetPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/PasswordResetUpdateRequest"
        example:
          token: reset-token-from-email
          password: new-password123
          password_confirmation: new-password123
  responses:
    "200":
      description: Password reset
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
