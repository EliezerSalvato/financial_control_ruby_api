patch:
  tags: [User]
  summary: Update profile
  description: |
    Partially updates the authenticated user's profile. Send any combination of `first_name`, `last_name`, and `configs`.
    `configs` is merged into the stored JSON: sent keys overwrite existing ones, and other keys are kept.
  operationId: updateProfile
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/ProfileUpdateRequest"
        examples:
          names:
            summary: Update names
            value:
              first_name: Jane
              last_name: Smith
          configs:
            summary: Merge configs without changing names
            value:
              configs:
                locale: pt-BR
  responses:
    "200":
      description: Profile updated
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
    "429":
      $ref: "../../components/responses.yml#/TooManyRequests"
