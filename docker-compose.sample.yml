x-api_default: &api_default
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
  networks:
    - local_network
  stdin_open: true
  tty: true
  restart: unless-stopped

services:
  api:
    <<: *api_default
    container_name: api
    ports:
      - '3000:3000'

  jobs:
    <<: *api_default
    container_name: jobs
    command: ["bin/jobs"]

  db:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - local_network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web
    networks:
      - local_network

volumes:
  postgres_data:
  bundle:

networks:
  local_network:
