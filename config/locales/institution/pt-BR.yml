---
pt-BR:
  activemodel:
    errors:
      models:
        core/institution/creation/input:
          attributes:
            base:
              institution_creation_failed: Falha ao criar a instituição
        core/institution/deletion/input:
          attributes:
            base:
              institution_destruction_failed: Falha ao excluir a instituição
              institution_not_found: Instituição não encontrada
              used_by_transactions: >-
                Esta instituição não pode ser excluída porque possui contas ou cartões de crédito já utilizados em transações. Para deixar de utilizá-la,
                inative a instituição.
        core/institution/update/input:
          attributes:
            base:
              institution_not_found: Instituição não encontrada
              institution_update_failed: Falha ao atualizar a instituição
  institution:
    creation:
      failure: Falha ao criar a instituição
      success: Instituição criada com sucesso
    deletion:
      failure: Falha ao excluir a instituição
      success: Instituição excluída com sucesso
    errors:
      invalid_filters: Filtro inválido
      not_found: Instituição não encontrada
    update:
      failure: Falha ao atualizar a instituição
      success: Instituição atualizada com sucesso
