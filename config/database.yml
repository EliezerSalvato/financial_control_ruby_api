default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { Rails.application.credentials.dig(:database, :max_connections) || 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { Rails.application.credentials.dig(:database, :host) || "db" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { Rails.application.credentials.dig(:database, :port) || 5432 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { Rails.application.credentials.dig(:database, :username) || "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { Rails.application.credentials.dig(:database, :password) || "postgres" } %>

<% database_name = ENV.fetch("POSTGRES_DB") { Rails.application.credentials.dig(:database, :name) || "app_db" } %>

development:
  primary:
    <<: *default
    database: <%= "#{database_name}_development" %>
  queue:
    <<: *default
    database: <%= "#{database_name}_development_queue" %>
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: <%= "#{database_name}_test" %>

production:
  primary:
    <<: *default
    database: <%= database_name %>
  queue:
    <<: *default
    database: <%= "#{database_name}_queue" %>
    migrations_paths: db/queue_migrate
